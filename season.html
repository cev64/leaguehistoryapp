    /* Panels ------------------------------------------------------- */

    .panel-stack {
      display: grid;
      gap: 16px;
    }

    .empty-state {
      background: var(--surface);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      padding: 34px 22px;
      text-align: center;
      color: var(--muted);
    }

    .empty-state strong {
      display: block;
      color: var(--ink);
      font-size: 16px;
      margin-bottom: 6px;
    }

    .empty-state p { margin: 0 auto; max-width: 52ch; font-size: 13.5px; line-height: 1.55; }

    /* Scoreboard --------------------------------------------------- */

    .score-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 12px;
    }

    .game-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .game-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 13px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
      font-size: 10.5px;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .game-card-head .game-margin { color: var(--ink); letter-spacing: .04em; }

    .game-side {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 13px;
      min-width: 0;
      cursor: pointer;
      transition: background .15s ease;
    }

    /* The team button covers its whole row, so tapping the logo, the name or
       the score opens that team's season; the chevron says a row goes somewhere. */
    .game-side .game-team::before { content: ""; position: absolute; inset: 0; }
    .game-side::after {
      content: "\203A";
      flex: 0 0 auto;
      margin-left: -2px;
      color: #9aa6b2;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
    }
    @media (hover: hover) { .game-side:hover { background: rgba(23, 105, 224, .05); } }
    .game-side:has(.game-team:focus-visible) { outline: 2px solid var(--blue); outline-offset: -2px; }
    .game-side .game-team:focus-visible { outline: none; }

    .game-side + .game-side { border-top: 1px solid var(--line); }

    .game-side .mini-badge { flex: 0 0 auto; }

    .game-side .game-team {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
      text-align: left;
      background: none;
      border: 0;
      padding: 0;
    }

    .game-side .game-team strong {
      font-size: 14px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .game-side .game-team span { font-size: 11.5px; color: var(--muted); }

    .game-side .game-score {
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      font-size: 17px;
      color: var(--muted);
    }

    .game-side.winner { background: rgba(22, 131, 74, .06); }
    @media (hover: hover) { .game-side.winner:hover { background: rgba(22, 131, 74, .11); } }
    .game-side.winner .game-score { color: var(--ink); }
    .game-side.winner .game-team strong { color: var(--ink); }

    .game-side .win-flag {
      width: 4px;
      align-self: stretch;
      border-radius: 999px;
      background: transparent;
      flex: 0 0 auto;
    }

    .game-side.winner .win-flag { background: var(--green); }

    /* Standings extras --------------------------------------------- */

    .standings-note {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }

    .legend-key {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      background: var(--blue);
    }

    .legend-swatch.wildcard { background: var(--gold); }
    .legend-swatch.toilet { background: #9aa6b6; }

    tr.seed-div td:first-child { box-shadow: inset 3px 0 0 var(--blue); }
    tr.seed-wc td:first-child { box-shadow: inset 3px 0 0 var(--gold); }
    tr.seed-toilet td:first-child { box-shadow: inset 3px 0 0 #9aa6b6; }

    .result-pill.pending { background: #b9c3cd; }

    .streak {
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      font-size: 12px;
    }

    .streak.win { color: var(--green); }
    .streak.loss { color: var(--red); }

    /* Playoff picture ---------------------------------------------- */

    .picture-grid {
      display: grid;
      align-items: start;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    }

    .seed-list {
      display: flex;
      flex-direction: column;
    }

    .seed-row {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 15px;
      border-top: 1px solid var(--line);
      min-width: 0;
    }

    .seed-row:first-child { border-top: 0; }

    .seed-chip {
      flex: 0 0 auto;
      width: 34px;
      height: 30px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 900;
      color: #fff;
      background: var(--navy-2);
      letter-spacing: .02em;
    }

    .seed-chip.div { background: var(--blue); }
    .seed-chip.wc { background: var(--gold); color: #3a2a02; }
    .seed-chip.out { background: #9aa6b6; }

    .seed-row .seed-body {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .seed-row .seed-copy { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .seed-row .seed-copy strong { font-size: 14px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .seed-row .seed-copy span { font-size: 11.5px; color: var(--muted); }

    .seed-row .seed-line {
      flex: 0 0 auto;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .seed-row .seed-line strong { display: block; font-size: 14px; font-weight: 900; }
    .seed-row .seed-line span { font-size: 11px; color: var(--muted); }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 15px 13px;
    }

    .rule-tag {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: .04em;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      color: var(--muted);
    }

    .rule-tag.flip { background: rgba(246, 183, 60, .16); border-color: rgba(246, 183, 60, .5); color: #7a5605; }

    .projected-matchups {
      display: grid;
      gap: 10px;
      padding: 14px 15px 16px;
    }

    .side-block { display: grid; gap: 8px; }

    .side-block + .side-block { margin-top: 6px; }

    .side-title {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .projected-game {
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface-2);
    }

    .projected-game .pg-head {
      padding: 6px 12px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .11em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .projected-game .pg-side {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px;
      min-width: 0;
    }

    .projected-game .pg-side + .pg-side { border-top: 1px solid var(--line); }
    .projected-game .pg-side .seed { font-size: 10px; font-weight: 900; color: #758191; white-space: nowrap; min-width: 30px; }
    .projected-game .pg-side .pg-name { font-size: 13.5px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; min-width: 0; }
    .projected-game .pg-side .pg-rec { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
    .projected-game .pg-bye { padding: 9px 12px; font-size: 11.5px; color: var(--muted); font-weight: 700; }

    /* Weekly summary ------------------------------------------------ */

    .summary-card .summary-body {
      padding: 4px 20px 20px;
      font-size: 15px;
      line-height: 1.68;
      color: #24354a;
    }

    .summary-card .summary-body h4 {
      margin: 20px 0 6px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .11em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .summary-card .summary-body p { margin: 0 0 12px; }
    .summary-card .summary-body p:last-child { margin-bottom: 0; }
    .summary-card .summary-body strong { color: var(--ink); }

    /* Box score modal ------------------------------------------------ */

    .bx-cue {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--blue);
      font-weight: 900;
    }

    .bx-cue::after { content: "\203A"; font-size: 13px; line-height: 1; }

    /* The box score button at the foot of a results card. */
    .bx-open {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 13px;
      border: 0;
      border-top: 1px solid var(--line);
      background: rgba(23, 105, 224, .06);
      color: var(--blue);
      font: inherit;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .02em;
      cursor: pointer;
      transition: background .15s ease;
    }
    .bx-open svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; }
    .bx-open i { font-style: normal; font-size: 16px; line-height: 1; }
    @media (hover: hover) { .bx-open:hover { background: rgba(23, 105, 224, .12); } }
    .bx-open:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }

    /* Its smaller twin under a bracket matchup. */
    .bx-cue-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 4px 8px 5px;
      border: 0;
      border-top: 1px solid var(--line);
      background: rgba(23, 105, 224, .05);
      font: inherit;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--blue);
      cursor: pointer;
    }
    .bx-cue-row svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 1.7; }
    .bx-cue-row i { font-style: normal; font-size: 12px; line-height: 1; }
    @media (hover: hover) { .bx-cue-row:hover { background: rgba(23, 105, 224, .12); } }

    .bx-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(7, 24, 39, .55);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }

    .bx-backdrop.open { opacity: 1; pointer-events: auto; }

    .bx-modal {
      position: fixed;
      z-index: 61;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -48%) scale(.98);
      width: min(880px, calc(100vw - 32px));
      max-height: min(88vh, 900px);
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: 0 30px 70px rgba(7, 24, 39, .35);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      overflow: hidden;
    }

    .bx-modal.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }

    .bx-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: var(--navy);
      color: #fff;
      flex: 0 0 auto;
    }

    .bx-head h3 { margin: 0; font-size: 21px; letter-spacing: -.02em; line-height: 1.1; }
    .bx-head .bx-sub:empty { display: none; }
    .bx-head .bx-sub { display: block; font-size: 9.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.62); margin-top: 3px; }

    .bx-close {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      color: #fff;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }

    .bx-close:hover { background: rgba(255,255,255,.22); }

    .bx-cols { overflow-y: auto; flex: 1 1 auto; }

    /* One row per lineup slot, the slot itself running down the middle with
       each team's points tucked against it — the layout the league already
       reads on their phones. The same grid serves every width, so there is
       one thing to get right rather than a phone version and a desktop one. */
    .bx-sb, .bx-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 52px 48px 52px minmax(0, 1fr);
      align-items: center;
    }

    .bx-sb {
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 1;
    }

    /* The scoreboard's centre cell carries no slot label, and its grey fill was
       painting over long totals like 176.38. No fill, wider score cells, and a
       narrower middle so the overall width still matches the rows below. */
    .bx-sb { grid-template-columns: minmax(0, 1fr) 62px 28px 62px minmax(0, 1fr); }
    .bx-sb .bx-slot { background: none; }

    .bx-sb .bx-name { font-weight: 900; font-size: 13.5px; }
    .bx-sb .bx-p { padding: 0; }
    .bx-sb .bx-p.bx-l { padding-right: 10px; }
    .bx-sb .bx-p.bx-r { padding-left: 10px; }
    .bx-total b { font-size: 18px; }
    .bx-total.bx-won b { color: var(--green); }

    .bx-row { padding: 0 14px; border-top: 1px solid rgba(220, 227, 235, .6); }

    .bx-p {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      padding: 7px 0;
    }

    .bx-p.bx-r { justify-content: flex-end; }

    .bx-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
      font-size: 12.5px;
      color: var(--ink);
    }

    .bx-nfl {
      flex: 0 0 auto;
      min-width: 28px;
      text-align: center;
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 8.5px;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .bx-inj { flex: 0 0 auto; font-size: 9px; font-weight: 900; color: var(--red); }

    .bx-sc { text-align: center; padding: 5px 0; }
    .bx-sc b { display: block; font-size: 12.5px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .bx-sc small { display: block; font-size: 9px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 1px; }

    /* Stretching the centre cell is what makes the slot column read as one
       continuous strip instead of a stack of separate chips. */
    .bx-slot {
      align-self: stretch;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-2);
      font-size: 9.5px;
      font-weight: 900;
      letter-spacing: .03em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .bx-grouphead { background: var(--page); border-top: 1px solid var(--line); }
    .bx-grouphead .bx-slot { background: var(--page); }
    .bx-glabel { font-size: 9px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .bx-grouphead .bx-p { padding: 5px 0; }

    .bx-foot {
      flex: 0 0 auto;
      padding: 9px 14px;
      border-top: 1px solid var(--line);
      background: var(--surface-2);
      font-size: 10px;
      color: var(--muted);
    }

    @media (max-width: 760px) {
      /* Phones: a bottom sheet, like the player card. */
      .bx-modal {
        left: 0; top: auto; bottom: 0; width: 100%; max-height: 92dvh;
        border-radius: 16px 16px 0 0;
        transform: translateY(24px);
      }
      .bx-modal.open { transform: none; }
      .bx-head { padding: 10px 12px; }
      .bx-head h3 { font-size: 18px; }
      .bx-row { grid-template-columns: minmax(0, 1fr) 42px 40px 42px minmax(0, 1fr); }
      .bx-sb { grid-template-columns: minmax(0, 1fr) 52px 20px 52px minmax(0, 1fr); }
      .bx-sb, .bx-row { padding-left: 8px; padding-right: 8px; }
      .bx-name { font-size: 11.5px; }
      .bx-sb .bx-name { font-size: 12px; }
      .bx-nfl { min-width: 24px; font-size: 7.5px; padding: 1.5px 3px; }
      .bx-sc b { font-size: 11.5px; }
      .bx-total b { font-size: 15px; }
      .bx-p { gap: 4px; }
    }

    .summary-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px 0;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .summary-superlatives {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
      padding: 4px 20px 20px;
    }

    .superlative {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-2);
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .superlative small {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .11em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .superlative strong { font-size: 14px; font-weight: 800; line-height: 1.2; }
    .superlative span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

    @media (max-width: 560px) {
      .seed-row { padding: 10px 12px; gap: 9px; }
      .seed-chip { width: 30px; height: 27px; font-size: 10px; }
      .summary-card .summary-body { padding: 4px 14px 16px; font-size: 14.5px; }
      .summary-superlatives { padding: 4px 14px 16px; }
      .summary-meta { padding: 12px 14px 0; }
    }

    /* Bulleted weekly recap */
    .recap-list {
      list-style: none;
      margin: 0;
      padding: 4px 20px 20px;
      display: grid;
      gap: 10px;
    }

    .recap-list li {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      font-size: 15px;
      line-height: 1.5;
      color: #24354a;
    }

    .recap-list li > span { min-width: 0; }

    .recap-list li::before {
      content: "";
      flex: 0 0 auto;
      width: 7px;
      height: 7px;
      margin-top: 8px;
      border-radius: 2px;
      background: var(--blue);
      transform: rotate(45deg);
    }

    .recap-list strong { color: var(--ink); font-weight: 800; }

    @media (max-width: 560px) {
      .recap-list { padding: 4px 14px 16px; gap: 9px; }
      .recap-list li { font-size: 14px; }
    }


    /* Seed, clinch, and tiebreaker markers in the standings tables ---- */

    .team-flags {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-left: 8px;
      vertical-align: middle;
    }

    .seed-tag {
      font-size: 9.5px;
      font-weight: 900;
      letter-spacing: .03em;
      padding: 3px 5px;
      border-radius: 5px;
      color: #fff;
      background: var(--navy-2);
      white-space: nowrap;
    }

    .seed-tag.div { background: var(--blue); }
    .seed-tag.div.lead { background: var(--green); }
    .seed-tag.wc { background: var(--gold); color: #3a2a02; }
    .seed-tag.out { background: #9aa6b6; }

    .clinch-tag {
      width: 16px;
      height: 16px;
      border-radius: 5px;
      display: inline-grid;
      place-items: center;
      font-size: 10px;
      font-weight: 900;
      color: #fff;
      background: var(--green);
      flex: 0 0 auto;
    }

    .clinch-tag.x { background: var(--blue); }
    .clinch-tag.e { background: #9aa6b6; }

    .why-btn {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      font-style: italic;
      display: inline-grid;
      place-items: center;
      padding: 0;
      line-height: 1;
      flex: 0 0 auto;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }

    .why-btn:hover, .why-btn:focus-visible {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .why-pop {
      position: fixed;
      z-index: 90;
      width: max-content;
      max-width: min(300px, calc(100vw - 24px));
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 13px;
      box-shadow: 0 18px 44px rgba(7, 24, 39, .24);
      padding: 13px 15px;
    }

    .why-head {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .06em;
      color: var(--muted);
      padding-bottom: 9px;
      margin-bottom: 11px;
      border-bottom: 1px solid var(--line);
    }

    .why-entry + .why-entry {
      margin-top: 13px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .why-pop h4 {
      margin: 0 0 6px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--blue-2);
    }

    .why-pop p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--ink); }
    .why-pop .why-team { margin-top: 8px; font-size: 12px; color: var(--muted); }

    .standings-note .legend-key .seed-tag,
    .standings-note .legend-key .clinch-tag,
    .standings-note .legend-key .why-btn { margin-right: 2px; }

    td.gb, th.gb { white-space: nowrap; font-variant-numeric: tabular-nums; }

    /* The seed and clinch markers widen the team cell, so let the division
       tables size it to content instead of holding a 250px floor. */
    .division-grid .team-cell { min-width: 168px; }

    /* Between the tablet stack point and full width the two-up cards are too
       narrow for eight columns, so stack them a little earlier. */
    @media (max-width: 1120px) {
      .division-grid { grid-template-columns: minmax(0, 1fr); }
    }

    /* Eight columns in a half-width card: tighten the gutters so DIV fits. */
    .division-grid th,
    .division-grid td { padding-left: 9px; padding-right: 9px; }

    /* Full projected bracket ---------------------------------------- */

    .bracket-rounds {
      display: grid;
      gap: 14px;
      padding: 15px 15px 17px;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      align-items: start;
    }

    .bracket-round { display: grid; gap: 9px; align-content: start; }

    .bracket-round .round-label {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .bracket-round .round-label span {
      display: block;
      margin-top: 2px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      color: var(--muted);
    }

    .pg-name.tbd { color: var(--muted); font-weight: 700; }

    @media (max-width: 700px) {
      .team-flags { margin-left: 6px; gap: 4px; }
      .bracket-rounds { padding: 12px 12px 14px; gap: 12px; }
    }

    /* Playoff odds card ---------------------------------------------- */

    .odds-head,
    .odds-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      min-width: 0;
    }

    .odds-head {
      padding-top: 12px;
      padding-bottom: 6px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
    }

    .odds-grid { padding: 4px 4px 14px; }

    .odds-row { border-radius: 10px; }
    .odds-row:nth-child(odd) { background: var(--surface-2); }

    .odds-team {
      flex: 1 1 150px;
      min-width: 0;
      font-size: 13.5px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .odds-head .odds-team { font-weight: 900; }

    .odds-track {
      flex: 1 1 130px;
      min-width: 70px;
      height: 8px;
      border-radius: 999px;
      background: rgba(12, 28, 45, .09);
      overflow: hidden;
    }

    .odds-head .odds-track { background: none; height: auto; }

    .odds-track { display: flex; gap: 2px; }
    .odds-head .odds-track { display: block; }

    .odds-seg { height: 100%; flex: 0 0 auto; }
    .odds-seg.s-bye { background: #0f4c9e; }
    .odds-seg.s-in { background: #5a9bec; }

    .odds-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 15px;
      align-items: center;
      padding: 13px 16px 2px;
      font-size: 11.5px;
      color: var(--muted);
    }

    .odds-key { width: 11px; height: 11px; min-height: 0; border-radius: 3px; background: #e7ebf0; display: block; flex: 0 0 auto; }
    .odds-key.s-bye { background: #0f4c9e; }
    .odds-key.s-in { background: #5a9bec; }

    .odds-pct {
      flex: 0 0 auto;
      width: 52px;
      text-align: right;
      font-size: 12.5px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    .odds-pct.primary { font-size: 14px; font-weight: 900; color: var(--ink); }
    .odds-pct.settled { color: var(--ink); font-weight: 900; }
    .odds-head .odds-pct { font-size: 10px; font-weight: 900; color: var(--muted); }

    /* The three figures are their own columns on a wide screen, so the wrapper
       gets out of the way and lets them line up under the header. */
    .odds-nums { display: contents; }

    @media (max-width: 700px) {
      /* No room for a header row on a phone, so each figure carries its own
         label and the three of them take a line of their own under the team. */
      .odds-head { display: none; }
      .odds-row { flex-wrap: wrap; padding: 11px 12px; gap: 9px; }
      .odds-team { flex: 1 1 auto; }
      .odds-track { order: 3; flex: 1 1 100%; }

      .odds-nums {
        display: flex;
        order: 2;
        flex: 1 1 100%;
        gap: 10px;
      }

      .odds-pct {
        flex: 1 1 0;
        width: auto;
        min-width: 0;
        display: flex;
        flex-direction: column-reverse;
        align-items: flex-start;
        gap: 2px;
        text-align: left;
      }

      .odds-pct::after {
        content: attr(data-label);
        font-size: 9px;
        font-weight: 900;
        letter-spacing: .09em;
        text-transform: uppercase;
        color: var(--muted);
      }
    }

      /* A logo is the team's identity on its own, so the chip stops shouting the
       team colour underneath it — a teal shield on a teal chip loses its edge.
       The colour stays as a hairline ring, which keeps the row scannable. An
       emoji badge is unchanged: it needs the colour to read at all. */
    .team-badge:has(.team-logo),
    .mini-badge:has(.team-logo),
    .profile-logo:has(.team-logo) {
      background: #fff;
      box-shadow: inset 0 0 0 1.5px var(--team-color, #667);
    }
    .team-badge .team-logo,
    .mini-badge .team-logo,
    .profile-logo .team-logo {
      width: 82%;
      height: 82%;
      object-fit: contain;
      display: block;
      margin: auto;
    }

    /* Projected brackets on a week's Playoff Picture tab: the season bracket's
       markup, with records in the score column and placeholders for open slots. */
    .matchup-row.projected { color: var(--ink); font-weight: 800; }
    .matchup-row .bk-rec { color: #758191; font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .matchup-row.bk-tbd { min-height: 39px; }
    .bk-tbd-name { min-width: 0; color: #8a95a2; font-size: 11.5px; font-style: italic; font-weight: 700; }
    .bk-note { color: var(--muted); font-size: 12px; font-weight: 700; text-align: right; }
    .panel-stack > .losers-card { margin-top: 0; }

    @media (max-width: 700px) {
      .matchup-row .bk-rec { font-size: 8.5px; }
      .matchup-row.bk-tbd { min-height: 28px; }
      .bk-tbd-name { font-size: 8.5px; line-height: 1.12; }
      .bk-note { font-size: 10px; }
      .mobile-winner-tree .matchup-row.bk-tbd { min-height: 36px; }
      .mobile-winner-tree .bk-tbd-name { font-size: 9.5px; line-height: 1.08; }
      .mobile-winner-tree .matchup-row .bk-rec { font-size: 9px; }
    }

    /* Third-place game: a quiet card tucked under the title game. It sits at
       the foot of the Championship column so the gold card keeps the centre. */
    .winners-bracket .round-3 .round-games { position: relative; }
    .third-place-matchup {
      border-color: #dde3ea;
      background: #fbfcfd;
      box-shadow: none;
      padding: 6px 10px;
    }
    .winners-bracket .third-place-matchup {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
    }
    .third-place-matchup .matchup-row { padding: 5px 2px; font-size: 11px; }
    .third-place-matchup .matchup-row .score { font-size: 12px; }
    .third-place-matchup .mini-badge { width: 19px; height: 19px; border-radius: 6px; font-size: 10px; }
    .third-place-matchup .matchup-row.bk-tbd { min-height: 31px; }
    .third-place-matchup .bk-tbd-name { font-size: 10.5px; }
    .third-place-matchup .place-note { color: #8a95a2; font-size: 10px; font-weight: 800; letter-spacing: .04em; }

    @media (max-width: 700px) {
      .mobile-third-place-card {
        width: min(100%, 330px);
        margin: 12px auto 0;
      }
      .mobile-winner-tree .third-place-matchup { padding: 4px 7px; box-shadow: none; }
      .mobile-winner-tree .third-place-matchup .matchup-row { min-height: 28px; padding: 4px 0; }
      .mobile-winner-tree .third-place-matchup .mini-badge { width: 20px; height: 20px; font-size: 10px; }
      .mobile-winner-tree .third-place-matchup .mini-team > span:last-child { font-size: 8.5px; }
      .mobile-winner-tree .third-place-matchup .matchup-row .score { font-size: 9px; }
      .mobile-winner-tree .third-place-matchup .matchup-row.bk-tbd { min-height: 28px; }
      .mobile-winner-tree .third-place-matchup .bk-tbd-name { font-size: 8.5px; }
      .third-place-matchup .place-note { font-size: 8px; }
    }

    /* On mobile the bye teams first appear in the Semifinals; Round 1 shows only the games played. */
    .mobile-winner-tree .mobile-bye-card { display: none; }

    /* Team drawer: every player the team started ---------------------- */

    .roster-list {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }

    .roster-row {
      display: grid;
      grid-template-columns: 28px minmax(96px, 150px) minmax(0, 1fr) 28px 50px;
      gap: 8px;
      align-items: center;
      padding: 7px 12px;
      border-top: 1px solid #edf0f3;
      font-variant-numeric: tabular-nums;
    }

    .roster-row:first-child { border-top: 0; }

    .roster-row.header {
      padding-top: 8px;
      padding-bottom: 8px;
      background: #f6f8fa;
      color: #788696;
      font-size: 8px;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .roster-row .bx-nfl { min-width: 28px; }

    .roster-name { min-width: 0; }
    /* A long name wraps to a second line rather than taking width from the
       week strip, which gets whatever the row has left. */
    .roster-name strong {
      display: -webkit-box;
      overflow: hidden;
      color: var(--ink);
      font-size: 12px;
      line-height: 1.2;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow-wrap: anywhere;
    }
    .roster-name small { color: var(--muted); font-size: 9px; font-weight: 800; letter-spacing: .03em; }

    /* One cell per week: filled in the team's colour when he started (deeper
       for a bigger score), outlined when he sat on the bench, blank when he
       was not on the team. The playoff weeks stand a little apart. */
    .roster-strip {
      display: grid;
      grid-template-columns: repeat(var(--reg), minmax(0, 1fr)) 4px repeat(var(--po), minmax(0, 1fr));
      gap: 2px;
    }

    .roster-wk {
      height: 16px;
      border-radius: 3px;
      background: #f1f4f7;
    }

    .roster-wk.start { background: color-mix(in srgb, var(--team-color) calc(var(--fill) * 100%), #fff); }
    .roster-wk.bench { background: #fff; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--team-color) 45%, #fff); }
    .roster-wk.none { background: transparent; }
    .roster-wk.future { background: transparent; box-shadow: inset 0 0 0 1px #dfe5ec; }
    .roster-gap { width: 0; }

    .roster-row.header .roster-wk {
      height: auto;
      background: none;
      box-shadow: none;
      font-size: 7.5px;
      text-align: center;
      letter-spacing: 0;
    }

    .roster-num { text-align: right; }
    .roster-num strong { display: block; color: var(--ink); font-size: 12.5px; }
    .roster-num small { color: var(--muted); font-size: 8px; }

    .roster-title { display: flex; align-items: center; gap: 7px; }

    /* The (i) beside the heading opens this; it explains the week strip. */
    .roster-help {
      margin: 0 2px 10px;
      padding: 10px 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      font-size: 11.5px;
      line-height: 1.45;
    }
    .roster-help[hidden] { display: none; }
    .roster-help p { margin: 0 0 6px; font-weight: 700; }
    .roster-help .roster-help-foot { margin: 8px 0 0; color: var(--muted); font-weight: 600; }
    .roster-help ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; }
    .roster-help li { display: flex; align-items: flex-start; gap: 8px; }
    .roster-help .roster-wk { flex: 0 0 auto; display: inline-block; width: 14px; height: 14px; margin-top: 1px; }
    .roster-help .roster-wk.none { border: 1.5px dashed #c9d2dc; box-sizing: border-box; }

    @media (max-width: 560px) {
      .roster-row {
        grid-template-columns: 20px 84px minmax(0, 1fr) 20px;
        gap: 5px;
        padding: 7px 8px;
      }
      .roster-row .bx-nfl { min-width: 20px; font-size: 6.5px; padding: 1.5px 1px; }
      .roster-row > :nth-child(5) { display: none; }
      .roster-name strong { font-size: 10.5px; }
      .roster-name small { font-size: 8px; }
      .roster-strip { gap: 1px; grid-template-columns: repeat(var(--reg), minmax(0, 1fr)) 2px repeat(var(--po), minmax(0, 1fr)); }
      .roster-wk { height: 14px; border-radius: 2px; }
      .roster-row.header .roster-wk { font-size: 6.5px; letter-spacing: -.03em; }
    }

    /* Sortable headers line up with their column: numbers sit right, so
       their headers do too. */
    th .sort-button { justify-content: flex-end; }
    th:first-child .sort-button, th:nth-child(2) .sort-button { justify-content: flex-start; }
    th .sort-indicator:empty { display: none; }
  
    /* The week buttons share the rail's width, so every week fits on a
       desktop; on a narrower screen the rail still scrolls. */
    .week-pill { flex: 1 0 auto; padding: 9px 10px; }

    /* Phones: the week and the view pickers share one row. */
    .picker-row { display: contents; }
    @media (max-width: 700px) {
      .week-rail-wrap .week-rail-head { display: none; }
      .picker-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .picker-row #weekSelect,
      .picker-row #viewSelect {
        padding: 12px 32px 12px 13px;
        border-radius: 12px;
        background: var(--navy-2);
        font-size: 14px;
        text-overflow: ellipsis;
      }
      .picker-row .week-select-wrap::after,
      .picker-row .view-select-wrap::after { right: 14px; width: 7px; height: 7px; margin-top: -5px; border-width: 0 2px 2px 0; }
    }
  
    /* ---- Desktop: the navy header becomes a sidebar ----------------------
       On a wide screen the top bar and the hero stack into one navy column
       fixed down the left, with the red stripe on its edge, so the page's
       own content (week rail, tabs, tables) starts at the very top on the
       right. Narrower screens keep the header across the top. */
    @media (min-width: 1200px) {
      :root { --side: 340px; --topbar-h: 76px; }
      body { padding-left: var(--side); }
      .topbar {
        position: fixed; top: 0; left: 0; bottom: auto; width: var(--side);
        border-right: 4px solid var(--red);
      }
      .topbar-inner { width: auto; min-height: var(--topbar-h); padding: 0 18px 0 20px; gap: 10px; }
      .topbar .year-control > span { display: none; }
      .topbar .brand-title { font-size: 17px; }
      html body .hero {
        position: fixed; top: var(--topbar-h); bottom: 0; left: 0; z-index: 30;
        width: var(--side); overflow-y: auto; overscroll-behavior: contain;
        border-bottom: 0; border-right: 4px solid var(--red);
        scrollbar-width: none;
      }
      html body .hero::-webkit-scrollbar { display: none; }
      html body .hero .hero-inner,
      html body .hero .hero-inner.outcome-grid,
      html body .live-hero .hero-inner {
        width: auto; margin: 0; padding: 26px 20px 28px;
        display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start;
      }
      html body .hero-brief { width: auto; max-width: none; justify-self: stretch; }
      html body .live-status h1 { font-size: 38px; }
      .week-rail-wrap,
      main { width: min(1220px, calc(100% - 48px)); }
      .week-rail-wrap { margin-top: 24px; }
      main { padding-top: 22px; }
      main > .page-toolbar:first-child { margin-top: 0; }
      .topbar .brand-kicker { white-space: nowrap; letter-spacing: .16em; }
      /* Every week still fits beside the sidebar. */
      .week-rail { gap: 2px; }
      .week-pill { padding: 9px 6px; }
      /* Division tables sit two across in less room: let them fit it. */
      .division-grid table { min-width: 0; }
      .division-grid th, .division-grid td { padding-left: 7px; padding-right: 7px; }
      .division-grid .team-cell { min-width: 0; }
    }
    /* Beside the sidebar on a smaller desktop, the division tables take a
       row each rather than squeeze two across. */
    @media (min-width: 1200px) and (max-width: 1439px) {
      .division-grid { grid-template-columns: minmax(0, 1fr); }
    }
  
    /* Trophy Room: always in the header, between the brand and the season
       menu; in the desktop sidebar it sits under the menu. */
    .topbar-trophy {
      margin-left: auto;
      display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto;
      padding: 9px 13px;
      border: 1px solid rgba(246, 183, 60, .45); border-radius: 10px;
      background: rgba(246, 183, 60, .12);
      color: #fff; font-size: 13px; font-weight: 800; text-decoration: none; white-space: nowrap;
      transition: background .18s ease, border-color .18s ease;
    }
    .topbar-trophy:hover { background: rgba(246, 183, 60, .22); border-color: rgba(246, 183, 60, .7); }
    .topbar-trophy + .year-control { margin-left: 0; }
    @media (max-width: 700px) {
      .topbar-inner { gap: 8px; }
      .topbar-trophy { padding: 6px 9px; gap: 5px; font-size: 11.5px; border-radius: 9px; }
    }
    @media (max-width: 374px) {
      .topbar-trophy { font-size: 0; gap: 0; padding: 6px 8px; }
      .topbar-trophy span { font-size: 14px; }
    }
    @media (min-width: 1200px) {
      :root { --topbar-h: 124px; }
      .topbar-inner {
        display: grid; grid-template-columns: minmax(0, 1fr) auto;
        align-content: center; row-gap: 12px; column-gap: 10px; padding-top: 14px; padding-bottom: 14px;
      }
      .topbar .brand { grid-column: 1; grid-row: 1; }
      .topbar .year-control { grid-column: 2; grid-row: 1; }
      .topbar-trophy { grid-column: 1 / -1; grid-row: 2; margin: 0; justify-content: center; }
    }
  
    /* Team drawer: its name opens the team's all-time history, and each
       played score opens that game's box score (above the drawer). */
    .drawer-name-link { color: inherit; text-decoration: underline dotted rgba(255, 255, 255, .55) 1.5px; text-underline-offset: 5px; }
    @media (hover: hover) { .drawer-name-link:hover { text-decoration-style: solid; text-decoration-color: #fff; } }
    .schedule-score.bx-link { cursor: pointer; margin: -5px -7px; padding: 5px 7px; border-radius: 8px; transition: background .15s ease; }
    .schedule-score.bx-link strong { color: var(--blue-2); text-decoration: underline dotted rgba(23, 105, 224, .55) 1.5px; text-underline-offset: 3px; }
    @media (hover: hover) { .schedule-score.bx-link:hover { background: rgba(23, 105, 224, .08); } }
    .schedule-score.bx-link:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
    body:has(#teamDrawer.open) #bxBackdrop { z-index: 90; }
    body:has(#teamDrawer.open) #bxModal { z-index: 91; }

    /* ---------------------------------------------------------------
       Live-season additions.
       Everything above is the shared season-page design system; the
       rules below cover the pieces only the live hub needs.
       --------------------------------------------------------------- */

    .live-hero .hero-inner {
      display: grid;
      gap: 18px;
      grid-template-columns: minmax(0, 1fr);
      align-items: stretch;
      padding: 26px 20px 30px;
      max-width: 1180px;
      margin: 0 auto;
    }

    .live-status {
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: center;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: flex-start;
      padding: 5px 12px 5px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .12);
      border: 1px solid rgba(255, 255, 255, .22);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 0 0 rgba(215, 25, 32, .7);
      animation: livePulse 2.2s infinite;
    }

    @keyframes livePulse {
      70% { box-shadow: 0 0 0 9px rgba(215, 25, 32, 0); }
      100% { box-shadow: 0 0 0 0 rgba(215, 25, 32, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .live-dot { animation: none; }
    }

    .live-status h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.04;
      letter-spacing: -.02em;
    }

    .live-status p {
      margin: 0;
      max-width: 40ch;
      color: rgba(255, 255, 255, .72);
      font-size: 14.5px;
      line-height: 1.45;
    }

    .live-panel { display: none; }
    .live-panel.active { display: block; }

    @media (max-width: 900px) {
      .live-hero .hero-inner { grid-template-columns: minmax(0, 1fr); }
    }

    @media (max-width: 560px) {
      .live-hero .hero-inner { padding: 20px 14px 24px; gap: 14px; }
    }

    /* Phones: the header band held only the week's summary, which is
       retired, so the page starts at the week itself. */
    @media (max-width: 700px) {
      .live-hero { display: none; }
    }

    /* Season schedule grid (Week 0) --------------------------------- */

    .schedule-weeks {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 12px;
      padding: 14px 15px 16px;
    }

    .schedule-week-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface-2);
    }

    .schedule-week-card .swc-head {
      padding: 7px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-size: 10.5px;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .schedule-week-card .swc-head em {
      font-style: normal;
      color: var(--red);
      letter-spacing: .06em;
    }

    .swc-game {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      font-size: 12.5px;
      min-width: 0;
    }

    .swc-game + .swc-game { border-top: 1px solid var(--line); }
    .swc-game .swc-team { flex: 1 1 0; min-width: 0; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
    .swc-game .swc-team.right { text-align: right; }
    .swc-game .swc-vs { flex: 0 0 auto; color: var(--muted); font-size: 10px; font-weight: 900; letter-spacing: .08em; }

    /* Strength of schedule -------------------------------------------
       A diverging bar around a .500 baseline: red right of centre is a
       harder slate than average, blue left of centre is easier. The pair
       is the site's own red and blue, which clear the CVD separation and
       contrast checks against a white card. */

    .sos-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      align-items: center;
      padding: 16px 20px 4px;
      font-size: 12px;
      color: var(--muted);
    }

    .sos-swatch {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      background: var(--blue);
    }

    .sos-swatch.tough { background: var(--red); }
    .sos-swatch.even { background: #b9c3cd; }

    .sos-list { padding: 8px 8px 16px; }

    .sos-row {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 12px;
      border-radius: 11px;
      min-width: 0;
    }

    .sos-row:nth-child(odd) { background: var(--surface-2); }

    .sos-rank {
      flex: 0 0 auto;
      width: 20px;
      text-align: right;
      font-weight: 900;
      font-size: 12.5px;
      color: #7a8796;
      font-variant-numeric: tabular-nums;
    }

    .sos-team {
      flex: 1 1 168px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .sos-team strong { font-size: 14px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sos-team span { font-size: 11.5px; color: var(--muted); }

    .sos-plot {
      flex: 1 1 210px;
      position: relative;
      height: 14px;
      min-width: 120px;
    }

    /* The .500 baseline the bars diverge from. */
    .sos-axis {
      position: absolute;
      left: 50%;
      top: -2px;
      bottom: -2px;
      width: 1px;
      background: var(--line);
    }

    .sos-bar {
      position: absolute;
      top: 2px;
      height: 10px;
      background: var(--blue);
    }

    /* Rounded at the data end, square against the baseline. */
    .sos-bar.tough {
      left: 50%;
      background: var(--red);
      border-radius: 0 4px 4px 0;
    }

    .sos-bar.easy {
      right: 50%;
      background: var(--blue);
      border-radius: 4px 0 0 4px;
    }

    .sos-value {
      flex: 0 0 auto;
      width: 74px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .sos-value strong { display: block; font-size: 14.5px; font-weight: 900; }
    .sos-value span { font-size: 11px; color: var(--muted); }

    .sos-notes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    @media (max-width: 700px) {
      .sos-legend { padding: 11px 15px 4px; }
      .sos-list { padding: 6px 6px 12px; }
      .sos-row { flex-wrap: wrap; gap: 8px; padding: 10px; }
      .sos-team { flex: 1 1 auto; }
      .sos-plot { order: 3; flex: 1 1 100%; min-width: 0; }
      .sos-value { width: auto; }
    }
