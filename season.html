  <script>
    /* =================================================================
       ONE SEASON OF A SLEEPER LEAGUE

       season.html?league=<id>&season=<year>. Everything on the page is
       read from Sleeper through sleeper.js: the teams, every week's
       pairings and scores, and both playoff brackets. A season still being
       played opens on its latest week, with the standings, the playoff
       picture as it stands and the bracket filling in as it is played; a
       finished one opens on its final standings, champion and last place.

       Standings follow Sleeper's own order: games won (a tie counts half),
       then points for. With divisions, each division's leader is seeded
       first. Where two teams are level on record, the (i) beside them says
       how they were separated.
       ================================================================= */

    (function boot() {
      const leagueId = League.requireLeague();
      if (!leagueId) return;
      const status = document.getElementById("pageStatus");
      League.showStatus(status, { title: "Loading the league", copy: "Reading every season from Sleeper&hellip;" });
      League.load(leagueId, {
        onProgress: (done, total) => {
          if (total > 1) League.showStatus(status, { title: "Loading the league", copy: `Reading season ${Math.min(done + 1, total)} of ${total} from Sleeper&hellip;` });
        },
      }).then((model) => {
        const wanted = League.param("season");
        const season = (wanted && model.season(wanted)) || model.opening;
        if (!season) throw new Error("This league has no seasons on Sleeper yet.");
        status.innerHTML = "";
        League.remember({ id: leagueId, name: model.name, avatar: model.avatar, season: model.current.year });
        seasonPage(model, season);
      }).catch((error) => {
        League.showStatus(status, { title: "This league couldn't be loaded", copy: League.esc(error.message || "Sleeper didn't answer."), error: true });
        document.getElementById("heroInner").innerHTML = "";
      });
    })();

    function seasonPage(model, season) {

    /* =================================================================
       THE SEASON
       ================================================================= */

    window.TEAM_LOGOS = model.logos;
    League.dressHeader(model, season.year);
    document.title = `${model.name} · ${season.year}`;

    const SEASON = season.year;
    const S = season.settings;
    const FINISHED = season.finished;
    const REGULAR_WEEKS = S.regularWeeks;
    const PLAYOFF_TEAMS = Math.min(S.playoffTeams, Object.keys(season.teams).length);
    const BYES = S.byes;
    const MEDIAN = S.median;
    const WB = season.winnersBracket;
    const LB = season.losersBracket;
    const HAS_PLAYOFFS = PLAYOFF_TEAMS > 0 && WB.length > 0;
    const WB_ROUNDS = Math.max(0, ...WB.map((g) => g.r));
    const LB_ROUNDS = Math.max(0, ...LB.map((g) => g.r));
    const LAST_WEEK = HAS_PLAYOFFS ? Math.max(REGULAR_WEEKS, S.lastWeek) : REGULAR_WEEKS;

    /* A team's mark for a badge: their Sleeper avatar where there is one,
       otherwise the first character of the team's name. */
    const teamMark = (team) => {
      const src = team && team.ownerId && window.TEAM_LOGOS && window.TEAM_LOGOS[team.ownerId];
      return src ? `<img class="team-logo" src="${src}" alt="">` : League.esc((team && team.icon) || "");
    };

    const teams = season.teams;
    const TEAM_IDS = Object.keys(teams);
    const esc = League.esc;
    const nameOf = (id) => esc(teams[id].name);
    const ownerOf = (id) => esc(teams[id].owner);

    /* Divisions as Sleeper has them. A league without divisions is one
       table, headed "Standings". */
    const HAS_DIVISIONS = S.divisions.length > 1;
    const LEAGUE_TABLE = "Standings";
    const divisionOrder = {};
    if (HAS_DIVISIONS) {
      S.divisions.forEach((d) => { divisionOrder[d] = TEAM_IDS.filter((id) => teams[id].division === d); });
      const loose = TEAM_IDS.filter((id) => !teams[id].division);
      if (loose.length) divisionOrder["No Division"] = loose;
      Object.keys(divisionOrder).forEach((d) => { if (!divisionOrder[d].length) delete divisionOrder[d]; });
    } else {
      divisionOrder[LEAGUE_TABLE] = TEAM_IDS.slice();
    }
    const DIVISION_NAMES = Object.keys(divisionOrder);
    const divisionOf = (id) => (HAS_DIVISIONS ? teams[id].division || "No Division" : LEAGUE_TABLE);
    const divisionLabel = (d) => (/division/i.test(d) ? d : `${d} Division`);

    const schedule = season.schedule;
    const results = season.results;
    const medianResults = season.medianResults;
    const playedWeeks = season.playedWeeks;
    const lastPlayedWeek = playedWeeks.length ? playedWeeks[playedWeeks.length - 1] : 0;

    // The postseason games, looked up by bracket and game number.
    const postOf = (bracket, m) => season.postseason.find((g) => g.bracket === bracket && g.m === m) || null;
    const playoffWeekPlayed = (w) => w > REGULAR_WEEKS && w <= season.lastFinal &&
      season.postseason.some((g) => g.played && g.weeks.includes(w));
    const lastPlayoffWeek = () => Math.max(0, ...season.postseason.filter((g) => g.played).map((g) => g.week));
    const latestWeek = Math.max(lastPlayedWeek, lastPlayoffWeek());

    const NUMBER_WORDS = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten",
      "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen", "twenty"];
    const numberWord = (n) => NUMBER_WORDS[n] || String(n);
    const capital = (s) => s.charAt(0).toUpperCase() + s.slice(1);

    /* =================================================================
       ENGINE — records, tiebreakers, seeding
       ================================================================= */

    /* Primary club colours, with the ink that stays legible on each. */
    const NFL_TEAMS = {
      ARI: "#97233F", ATL: "#A71930", BAL: "#241773", BUF: "#00338D",
      CAR: "#0085CA", CHI: "#0B162A", CIN: "#FB4F14", CLE: "#311D00",
      DAL: "#041E42", DEN: "#FB4F14", DET: "#0076B6", GB:  "#203731",
      HOU: "#03202F", IND: "#002C5F", JAX: "#101820", KC:  "#E31837",
      LAC: "#0080C6", LAR: "#003594", LV:  "#111111", MIA: "#008E97",
      MIN: "#4F2683", NE:  "#002244", NO:  "#A08A5B", NYG: "#0B2265",
      NYJ: "#125740", PHI: "#004C54", PIT: "#FFB612", SEA: "#002244",
      SF:  "#AA0000", TB:  "#D50A0A", TEN: "#0C2340", WSH: "#5A1414",
      FA:  "#8A94A1"
    };

    /* Pittsburgh's yellow needs black text where Philadelphia's green needs
       white, so the ink is derived from the colour rather than assumed. */
    function readableInk(hex) {
      const n = parseInt(hex.slice(1), 16);
      const lum = (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
      return lum > 0.62 ? "#0b1726" : "#ffffff";
    }

    const fmt = (n) => Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmt1 = (n) => Number(n).toFixed(1);
    const pctText = (v) => v.toFixed(3).replace(/^0/, "");

    function gamesThrough(week) {
      const out = [];
      playedWeeks.filter((w) => w <= week).forEach((w) => {
        results[w].forEach(([a, as, b, bs]) => out.push({ week: w, a, as, b, bs }));
      });
      return out;
    }

    function blankLine(id) {
      return {
        id,
        wins: 0, losses: 0, ties: 0, gp: 0,
        pf: 0, pa: 0,
        divWins: 0, divLosses: 0, divTies: 0,
        form: []
      };
    }

    // Records for every team through the given week. In a league that also
    // plays the week's median, that result counts as a game too, as it does
    // in Sleeper's standings.
    function computeStats(week) {
      const stats = {};
      TEAM_IDS.forEach((id) => { stats[id] = blankLine(id); });

      gamesThrough(week).forEach((g) => {
        const sameDivision = HAS_DIVISIONS && divisionOf(g.a) === divisionOf(g.b);
        [[g.a, g.as, g.b, g.bs], [g.b, g.bs, g.a, g.as]].forEach(([id, own, oppId, opp]) => {
          const line = stats[id];
          line.gp += 1;
          line.pf += own;
          line.pa += opp;
          if (own > opp) { line.wins += 1; if (sameDivision) line.divWins += 1; line.form.push("W"); }
          else if (own < opp) { line.losses += 1; if (sameDivision) line.divLosses += 1; line.form.push("L"); }
          else { line.ties += 1; if (sameDivision) line.divTies += 1; line.form.push("T"); }
        });
      });

      if (MEDIAN) {
        playedWeeks.filter((w) => w <= week).forEach((w) => {
          Object.entries(medianResults[w] || {}).forEach(([id, r]) => {
            const line = stats[id];
            if (!line) return;
            if (r === "W") line.wins += 1; else if (r === "L") line.losses += 1; else line.ties += 1;
          });
        });
      }

      TEAM_IDS.forEach((id) => {
        const t = stats[id];
        const decided = t.wins + t.losses + t.ties;
        t.pct = decided ? (t.wins + t.ties * 0.5) / decided : 0;
        t.score = t.wins + t.ties * 0.5;
        t.divGp = t.divWins + t.divLosses + t.divTies;
        t.divPct = t.divGp ? (t.divWins + t.divTies * 0.5) / t.divGp : 0;
        t.record = t.ties ? `${t.wins}–${t.losses}–${t.ties}` : `${t.wins}–${t.losses}`;
        t.divRecord = t.divTies ? `${t.divWins}–${t.divLosses}–${t.divTies}` : `${t.divWins}–${t.divLosses}`;
        t.pf = Math.round(t.pf * 100) / 100;
        t.pa = Math.round(t.pa * 100) / 100;
        t.pfg = t.gp ? t.pf / t.gp : 0;
        t.pag = t.gp ? t.pa / t.gp : 0;
        t.diff = t.pf - t.pa;
        t.diffPerGame = t.gp ? t.diff / t.gp : 0;
      });

      return stats;
    }

    // A team can be caught in several races at once — its division, the
    // playoff seeding — so reasons accumulate.
    function addReason(reasons, id, entry) {
      if (!reasons) return;
      (reasons[id] = reasons[id] || []).push(entry);
    }

    /* Sleeper's order: record, then points for. Teams level on both are
       left as Sleeper would leave them, in roster order, and flagged. */
    function rankIds(ids, stats) {
      return ids.slice().sort((a, b) =>
        (stats[b].score - stats[a].score) || (stats[b].pf - stats[a].pf) || (teams[a].rosterId - teams[b].rosterId));
    }

    /* Any run of teams level on record inside an ordered race was separated
       on points for, so each of them gets an explanation. */
    function explainTies(ordered, stats, reasons, flips, race) {
      let i = 0;
      while (i < ordered.length) {
        let j = i;
        while (j + 1 < ordered.length && stats[ordered[j + 1]].score === stats[ordered[i]].score) j += 1;
        if (j > i) {
          const group = ordered.slice(i, j + 1);
          const ladder = group.map((id) => `${nameOf(id)} ${fmt(stats[id].pf)}`).join(", ");
          for (let k = 1; k < group.length; k++) {
            if (stats[group[k - 1]].pf === stats[group[k]].pf) flips.push([group[k - 1], group[k]]);
          }
          const detail = group.length === 2
            ? `${nameOf(group[0])} and ${nameOf(group[1])} were both ${stats[group[0]].record}. Sleeper breaks the tie on points for: ${ladder}.`
            : `${group.length} teams sat at ${stats[group[0]].record}. Sleeper ranks them on points for: ${ladder}.`;
          group.forEach((id, k) => {
            addReason(reasons, id, { race, criterion: "Points for", detail, over: group[k + 1] || null, under: k ? group[k - 1] : null });
          });
        }
        i = j + 1;
      }
    }

    // Division standings: record first, ties on points for.
    function orderDivision(division, week, stats, flips, reasons) {
      const ordered = rankIds(divisionOrder[division], stats);
      explainTies(ordered, stats, reasons, flips, HAS_DIVISIONS ? "Division standings" : "Standings");
      return ordered;
    }

    /* Games back of a leader, the standard baseball formula. */
    function gamesBack(leader, team) {
      return ((leader.wins - team.wins) + (team.losses - leader.losses)) / 2;
    }

    // The regular-season weeks still to come in which a team has a game.
    function gamesLeft(id, week) {
      let n = 0;
      for (let w = week + 1; w <= REGULAR_WEEKS; w++) {
        if ((schedule[w] || []).some(([a, b]) => a === id || b === id)) n += 1;
      }
      return n;
    }

    /* Clinch and elimination flags. Every test here is a *sufficient*
       condition, so a badge is never shown unless it is mathematically
       settled; a team can be safe before the badge appears, never after.
       Anyone who could still finish level on record is counted as a threat,
       since points for, the tiebreaker, cannot be known in advance.

       With divisions, every division's leader is seeded ahead of the rest,
       so a team that has not locked up its own division must also leave
       room for a leader of every division to be seeded above it. */
    function clinchFlags(week, stats, seeds, leaders) {
      const flags = {};
      if (!HAS_PLAYOFFS) return flags;
      const P = PLAYOFF_TEAMS;
      const seasonOver = week >= REGULAR_WEEKS || TEAM_IDS.every((id) => !gamesLeft(id, week));
      if (seasonOver) {
        seeds.forEach((id, i) => {
          flags[id] = (BYES ? i < BYES : HAS_DIVISIONS && leaders.includes(id)) ? "z" : i < P ? "x" : "e";
        });
        return flags;
      }

      const unit = MEDIAN ? 2 : 1;
      const minW = (id) => stats[id].score;
      const maxW = (id) => stats[id].score + gamesLeft(id, week) * unit;
      const D = HAS_DIVISIONS ? DIVISION_NAMES.length : 0;

      TEAM_IDS.forEach((id) => {
        const others = TEAM_IDS.filter((x) => x !== id);
        const couldCatch = others.filter((x) => maxW(x) >= minW(id)).length;
        const sureAhead = others.filter((x) => minW(x) > maxW(id)).length;
        const rivals = HAS_DIVISIONS ? others.filter((x) => divisionOf(x) === divisionOf(id)) : [];
        const ownDivision = HAS_DIVISIONS && rivals.every((x) => maxW(x) < minW(id));
        const lostDivision = !HAS_DIVISIONS || rivals.some((x) => minW(x) > maxW(id));

        let bye = false;
        if (BYES) {
          if (!HAS_DIVISIONS) bye = couldCatch < BYES;
          else if (ownDivision) {
            // Other divisions that could still produce a leader seeded above it.
            const threats = DIVISION_NAMES.filter((d) => d !== divisionOf(id) &&
              divisionOrder[d].some((x) => maxW(x) >= minW(id))).length;
            bye = threats < BYES;
          }
        }
        const berth = ownDivision || couldCatch + (HAS_DIVISIONS ? D - 1 : 0) < P;
        const out = lostDivision && sureAhead >= P;
        flags[id] = bye || (!BYES && ownDivision) ? "z" : berth ? "x" : out ? "e" : null;
      });
      return flags;
    }

    const CLINCH_KEY = {
      z: { label: "z", title: BYES ? "Clinched a first-round bye" : "Clinched the division" },
      x: { label: "x", title: "Clinched a playoff berth" },
      e: { label: "e", title: "Eliminated from playoff contention" }
    };

    /* The whole playoff picture as it stands after the given week. */
    const pictureCache = {};
    function buildPicture(week) {
      if (pictureCache[week]) return pictureCache[week];
      const stats = computeStats(week);
      const flips = [];
      const reasons = {};
      const divisions = {};
      DIVISION_NAMES.forEach((d) => { divisions[d] = orderDivision(d, week, stats, flips, reasons); });

      let seeds, leaders = [];
      if (HAS_DIVISIONS) {
        leaders = rankIds(DIVISION_NAMES.filter((d) => d !== "No Division").map((d) => divisions[d][0]).filter(Boolean), stats);
        const rest = rankIds(TEAM_IDS.filter((id) => !leaders.includes(id)), stats);
        explainTies(rest, stats, reasons, flips, "Playoff seeding");
        seeds = [...leaders, ...rest];
      } else {
        seeds = divisions[LEAGUE_TABLE].slice();
      }

      const seedLabels = {};
      if (HAS_PLAYOFFS) {
        seeds.forEach((id, i) => {
          const chip = `#${i + 1}`;
          if (i < BYES) seedLabels[id] = { chip, kind: "div", lead: true, note: `${chip} seed · first-round bye` };
          else if (i < PLAYOFF_TEAMS && leaders.includes(id)) seedLabels[id] = { chip, kind: "div", note: `${divisionOf(id)} leader` };
          else if (i < PLAYOFF_TEAMS) seedLabels[id] = { chip, kind: HAS_DIVISIONS ? "wc" : "div", note: HAS_DIVISIONS ? "Wild card" : `${chip} seed` };
          else seedLabels[id] = { chip, kind: "out", note: LB.length ? "Losers bracket" : "Missed the playoffs" };
        });
      }

      const flipPairs = flips.filter(([a, b], i, arr) =>
        arr.findIndex(([x, y]) => (x === a && y === b) || (x === b && y === a)) === i);

      const result = {
        week, stats, divisions, seeds, leaders, seedLabels, flips: flipPairs, reasons,
        playoffField: seeds.slice(0, PLAYOFF_TEAMS),
        firstOut: seeds[PLAYOFF_TEAMS] || null
      };
      result.flags = clinchFlags(week, stats, seeds, leaders);
      pictureCache[week] = result;
      return result;
    }


    /* =================================================================
       STRENGTH OF SCHEDULE

       Every opponent on the season's slate, weighted by how often they are
       played, scored on their record from the season before. A team never
       appears on its own schedule, which is what makes the measure invert:
       last year's worst teams draw the hardest slates precisely because
       they are the ones nobody has to play. Only offered where there is a
       season before this one to read.
       ================================================================= */

    const PRIOR = (() => {
      const before = model.seasons.filter((s) => s.year < SEASON && s.playedWeeks.length).pop();
      if (!before) return null;
      const byOwner = {};
      Object.values(before.teams).forEach((t) => { byOwner[t.ownerId] = [t.wins, t.losses]; });
      const records = {};
      TEAM_IDS.forEach((id) => { if (byOwner[teams[id].ownerId]) records[id] = byOwner[teams[id].ownerId]; });
      return Object.keys(records).length ? { year: before.year, records } : null;
    })();

    function strengthOfSchedule() {
      const priorPct = (id) => {
        const [w, l] = PRIOR.records[id] || [0, 0];
        return w + l ? w / (w + l) : 0;
      };

      const opponents = {};
      TEAM_IDS.forEach((id) => { opponents[id] = []; });
      Object.keys(schedule).map(Number).filter((w) => w <= REGULAR_WEEKS).forEach((w) => {
        schedule[w].forEach(([a, b]) => { opponents[a].push(b); opponents[b].push(a); });
      });

      const rows = TEAM_IDS.map((id) => {
        const opps = opponents[id];
        const wins = opps.reduce((n, x) => n + (PRIOR.records[x] || [0, 0])[0], 0);
        const losses = opps.reduce((n, x) => n + (PRIOR.records[x] || [0, 0])[1], 0);
        const counts = opps.reduce((acc, x) => { acc[x] = (acc[x] || 0) + 1; return acc; }, {});
        const twice = Object.keys(counts)
          .filter((x) => counts[x] > 1)
          .sort((a, b) => priorPct(b) - priorPct(a));
        return { id, games: opps.length, wins, losses, twice, sos: wins + losses ? wins / (wins + losses) : 0 };
      });

      rows.sort((a, b) => b.sos - a.sos || teams[a.id].name.localeCompare(teams[b.id].name));
      const spread = Math.max(...rows.map((r) => Math.abs(r.sos - 0.5))) || 1;
      rows.forEach((r) => { r.deviation = r.sos - 0.5; r.magnitude = Math.abs(r.deviation) / spread; });
      return rows;
    }

    function renderSosPanel() {
      const panel = document.getElementById("panel-sos");
      if (!PRIOR || !Object.keys(schedule).length) {
        panel.innerHTML = emptyState("No schedule to rate yet", "Strength of schedule needs this season's slate and a season before it to read records from.");
        return;
      }
      const rows = strengthOfSchedule();
      const pct3 = (v) => v.toFixed(3).replace(/^0/, "");
      const hardest = rows[0];
      const easiest = rows[rows.length - 1];

      const row = (r, i) => {
        const side = r.deviation > 0 ? "tough" : r.deviation < 0 ? "easy" : "even";
        // The bar diverges from a .500 baseline: right of centre is a harder
        // slate than average, left is easier. Length is scaled to the widest
        // deviation in the league, so the shape reads at this small a spread.
        const width = (r.magnitude * 46).toFixed(2);
        return `<div class="sos-row">
          <span class="sos-rank">${i + 1}</span>
          ${miniTeam(r.id)}
          <span class="sos-team">
            <strong>${nameOf(r.id)}</strong>
            <span>${ownerOf(r.id)}</span>
          </span>
          <span class="sos-plot" role="img"
            aria-label="${pct3(r.sos)} opponent win percentage, ${side === "even" ? "exactly average" : side === "tough" ? "above average" : "below average"}">
            <span class="sos-axis"></span>
            ${side === "even" ? "" : `<span class="sos-bar ${side}" style="width:${width}%"></span>`}
          </span>
          <span class="sos-value">
            <strong>${pct3(r.sos)}</strong>
            <span>${r.wins}–${r.losses}</span>
          </span>
        </div>`;
      };

      panel.innerHTML = `
        <div class="panel-stack">
          <article class="card">
            ${cardHead(`Strength of Schedule`, "schedule", `Opponents' ${PRIOR.year} records`)}
            <div class="sos-legend">
              <span class="legend-key"><span class="sos-swatch tough"></span>Tougher than average</span>
              <span class="legend-key"><span class="sos-swatch easy"></span>Easier than average</span>
              <span class="legend-key"><span class="sos-swatch even"></span>Baseline .500</span>
            </div>
            <div class="sos-list">${rows.map(row).join("")}</div>
          </article>
          <div class="sos-notes">
            <div class="superlative">
              <small>Toughest slate</small>
              <strong>${nameOf(hardest.id)}</strong>
              <span>${pct3(hardest.sos)} · opponents went ${hardest.wins}–${hardest.losses}</span>
            </div>
            <div class="superlative">
              <small>Easiest slate</small>
              <strong>${nameOf(easiest.id)}</strong>
              <span>${pct3(easiest.sos)} · opponents went ${easiest.wins}–${easiest.losses}</span>
            </div>
            <div class="superlative">
              <small>Spread</small>
              <strong>${pct3(hardest.sos - easiest.sos)} of win percentage</strong>
              <span>between the hardest and easiest schedules</span>
            </div>
          </div>
        </div>`;
    }

    /* =================================================================
       VIEW STATE
       ================================================================= */

    const HAS_BRACKET = season.postseason.some((g) => g.played);
    const SEASON_VIEWS = FINISHED
      ? [
        { id: "regular", label: "Regular Season", short: "Regular" },
        { id: "final", label: "Final Standings", short: "Final" },
        ...(HAS_BRACKET ? [{ id: "bracket", label: "Bracket" }] : [])
      ]
      : [
        { id: "panel-results", label: "Schedule" },
        { id: "panel-standings", label: "Standings" },
        ...(HAS_PLAYOFFS ? [{ id: "panel-picture", label: "Playoffs" }] : []),
        ...(PRIOR && Object.keys(schedule).length ? [{ id: "panel-sos", label: "Strength of Schedule", short: "SOS" }] : [])
      ];

    const weekViews = (week) => [
      { id: "panel-results", label: isPlayed(week) || FINISHED ? "Results" : "Matchups" },
      { id: "panel-standings", label: "Standings" },
      ...(HAS_PLAYOFFS ? [{ id: "panel-picture", label: "Playoffs" }] : [])
    ];

    const PLAYOFF_VIEWS = [
      { id: "panel-playoffs", label: "Bracket" },
      { id: "panel-standings", label: "Standings" }
    ];

    const viewsFor = (week) => (week === 0 ? SEASON_VIEWS : week > REGULAR_WEEKS ? PLAYOFF_VIEWS : weekViews(week));
    const HOME_VIEW = FINISHED ? "final" : SEASON_VIEWS[0].id;

    const state = FINISHED
      ? { week: 0, view: "final" }
      : { week: latestWeek, view: latestWeek > REGULAR_WEEKS ? "panel-playoffs" : latestWeek ? "panel-results" : SEASON_VIEWS[0].id };

    // Standings and the playoff picture for a week that has not been played
    // yet fall back to the most recent completed week.
    function asOfWeek(week) {
      const done = playedWeeks.filter((w) => w <= week);
      return done.length ? done[done.length - 1] : 0;
    }

    const isPlayed = (w) => playedWeeks.includes(w);

    /* =================================================================
       SHARED PIECES
       ================================================================= */

    function teamButton(id) {
      const t = teams[id];
      return `
        <button class="team-button" data-team="${id}" aria-label="Open ${nameOf(id)} schedule">
          <span class="team-badge" style="--team-color:${t.color}">${teamMark(t)}</span>
          <span class="team-meta"><span class="team-name">${nameOf(id)}</span><span class="owner">${ownerOf(id)}</span></span>
        </button>`;
    }

    function miniTeam(id, extra = "") {
      const t = teams[id];
      return `<span class="mini-badge" style="--team-color:${t.color}">${teamMark(t)}</span>${extra}`;
    }

    function emptyState(title, copy) {
      return `<div class="empty-state"><strong>${title}</strong><p>${copy}</p></div>`;
    }

    /* Card icons. Each names what its card is showing, so a header reads
       without needing a key. `cardHead` falls back to plain text for anything
       not listed. */
    const CARD_ICONS = {
      standings: '<path d="M2.8 4.3h10.4M2.8 8h7.2M2.8 11.7h4"/>',
      schedule:  '<rect x="2.6" y="3.4" width="10.8" height="10" rx="1.6"/><path d="M2.6 6.6h10.8M5.6 2.1v2.6M10.4 2.1v2.6"/>',
      rulebook:  '<path d="M8 4.6S6.5 3.1 3 3.1v9c3.5 0 5 1.5 5 1.5s1.5-1.5 5-1.5v-9c-3.5 0-5 1.5-5 1.5z"/><path d="M8 4.6v9"/>',
      toilet:    '<path d="M8 2.4v7.2M5.1 6.7 8 9.6l2.9-2.9M3.2 13.2h9.6"/>',
      notes:     '<rect x="3.1" y="2.5" width="9.8" height="11" rx="1.6"/><path d="M5.6 6h4.8M5.6 8.4h4.8M5.6 10.8h2.8"/>',
      bracket:   '<path d="M2.6 3.6h3.3v3.9h3.6M2.6 12.4h3.3V8.5M9.5 8h3.9"/>',
      versus:    '<path d="M2.6 4.6 5.5 8l-2.9 3.4M13.4 4.6 10.5 8l2.9 3.4M8 2.9v10.2"/>',
      document:  '<path d="M9.2 2.6H5.1a1.6 1.6 0 0 0-1.6 1.6v7.6a1.6 1.6 0 0 0 1.6 1.6h5.8a1.6 1.6 0 0 0 1.6-1.6V6z"/><path d="M9.2 2.6V6h3.3"/>',
      shield:    '<path d="M8 2.4 3.4 4.4v3.9c0 3 2 4.7 4.6 5.6 2.6-.9 4.6-2.6 4.6-5.6V4.4z"/>',
      recap:     '<path d="M13.2 9.6a1.6 1.6 0 0 1-1.6 1.6H6.2l-3.4 2.6V4.2a1.6 1.6 0 0 1 1.6-1.6h7.2a1.6 1.6 0 0 1 1.6 1.6z"/>'
    };

    const chipMark = (chip) => (CARD_ICONS[chip]
      ? `<svg class="chip-icon" viewBox="0 0 16 16" aria-hidden="true">${CARD_ICONS[chip]}</svg>`
      : chip);

    function cardHead(title, chip, meta) {
      return `<div class="card-head">
        <h3>${chip ? `<span class="division-chip">${chipMark(chip)}</span>` : ""}${title}</h3>
        ${meta ? `<span>${meta}</span>` : ""}
      </div>`;
    }

    // "NFL Week 15", or "NFL Weeks 17–18" for a round played over two.
    const weeksText = (weeks) => (weeks.length > 1 ? `NFL Weeks ${weeks[0]}–${weeks[weeks.length - 1]}` : `NFL Week ${weeks[0]}`);

    /* =================================================================
       HERO
       ================================================================= */

    function renderHero() {
      const hero = document.getElementById("hero");
      const inner = document.getElementById("heroInner");
      if (FINISHED) {
        hero.classList.remove("live-hero");
        inner.className = "hero-inner outcome-grid";
        inner.innerHTML = [
          season.champion ? outcomeCard("champion", season.champion, season.titleGame) : "",
          season.lastPlace ? outcomeCard("loser", season.lastPlace, season.lastPlaceGame) : ""
        ].join("");
        return;
      }

      hero.classList.add("live-hero");
      inner.className = "hero-inner";
      const n = TEAM_IDS.length;
      const P = PLAYOFF_TEAMS;
      const out = LB.length ? n - P : 0;
      let badge, sub;
      if (latestWeek > REGULAR_WEEKS) {
        badge = `Playoffs · Week ${latestWeek}`;
        sub = `The regular season is over. ${capital(numberWord(P))} teams made the playoffs.`;
      } else if (lastPlayedWeek) {
        badge = `Through Week ${lastPlayedWeek}`;
        sub = `Week ${lastPlayedWeek} of ${REGULAR_WEEKS}.${P ? ` ${capital(numberWord(P))} make the playoffs${out ? `, ${numberWord(out)} play in the losers bracket` : ""}.` : ""}`;
      } else if (season.unplayed) {
        badge = "Not played";
        sub = "Sleeper closed this season before a single game was scored.";
      } else {
        badge = "Preseason";
        sub = `${capital(numberWord(n))} teams. ${REGULAR_WEEKS} weeks.${P ? ` ${capital(numberWord(P))} make the playoffs.` : ""}`;
      }
      inner.innerHTML = `
        <div class="live-status">
          <span class="live-badge"><span class="live-dot" aria-hidden="true"></span><span id="liveBadgeText">${badge}</span></span>
          <h1 id="liveHeadline">${SEASON} Season</h1>
          <p id="liveSubhead">${sub}</p>
        </div>`;
    }

    /* A finished season's champion and last place, each with the game that
       settled it: the winner's score first on the champion's card, the
       loser's first on the last-place card. */
    function outcomeCard(kind, id, game) {
      const t = teams[id];
      const champ = kind === "champion";
      const label = champ ? `🏆 ${SEASON} Champion` : `💩 ${SEASON} Last Place`;
      const record = t.ties ? `${t.wins}–${t.losses}–${t.ties}` : `${t.wins}–${t.losses}`;
      let score = "";
      if (game && game.a && game.b) {
        const mine = game.a === id ? game.aScore : game.bScore;
        const oppId = game.a === id ? game.b : game.a;
        const theirs = game.a === id ? game.bScore : game.aScore;
        const arrow = mine >= theirs
          ? '<path d="M8 13V3.6M3.8 7.8 8 3.6l4.2 4.2"/>'
          : '<path d="M8 3v9.4M3.8 8.2 8 12.4l4.2-4.2"/>';
        score = `
        <div class="outcome-score">
          <div class="outcome-score-side">
            <strong>${fmt(mine)}</strong>
            <small>${nameOf(id)}</small>
          </div>
          <span class="outcome-status">FINAL</span>
          <div class="outcome-score-side">
            <strong>${fmt(theirs)}</strong>
            <small>${nameOf(oppId)}</small>
          </div>
        <span class="outcome-margin"><svg viewBox="0 0 16 16" aria-hidden="true">${arrow}</svg>${fmt(Math.abs(mine - theirs))}</span></div>`;
      }
      return `
      <article class="outcome-card ${champ ? "champion-outcome" : "loser-outcome"}">
        <div class="outcome-label">${label}</div>
        <div class="outcome-team">
          <span class="team-badge" style="--team-color:${t.color}">${teamMark(t)}</span>
          <div>
            <h2>${nameOf(id)}</h2>
            <span>${ownerOf(id)} · ${record} regular season</span>
          </div>
        </div>${score}
      </article>`;
    }

    /* =================================================================
       STANDINGS MARKERS — seeds, clinch flags, tiebreak explanations
       ================================================================= */

    // Populated as standings render; the popover reads explanations from here.
    const whyStore = {};

    function seedTag(picture, id) {
      const label = picture.seedLabels[id];
      if (!label) return "";
      const cls = label.kind === "div" ? (label.lead ? "div lead" : "div") : label.kind;
      return `<span class="seed-tag ${cls}" title="${label.note}">${label.chip}</span>`;
    }

    function clinchTag(picture, id) {
      const flag = picture.flags[id];
      if (!flag) return "";
      return `<span class="clinch-tag ${flag}" title="${CLINCH_KEY[flag].title}">${CLINCH_KEY[flag].label}</span>`;
    }

    function whyButton(picture, id, scope) {
      const entries = picture.reasons[id];
      if (!entries || !entries.length) return "";
      const key = `${scope}:${id}`;
      whyStore[key] = {
        team: nameOf(id),
        entries: entries.map((r) => ({
          race: r.race,
          criterion: r.criterion,
          detail: r.detail,
          note: r.note || null,
          over: r.over ? nameOf(r.over) : null,
          under: r.under ? nameOf(r.under) : null
        }))
      };
      return `<button type="button" class="why-btn" data-why="${key}"
        aria-label="Tiebreakers involving ${nameOf(id)}">i</button>`;
    }

    function teamFlags(picture, id, scope) {
      const inner = seedTag(picture, id) + clinchTag(picture, id) + whyButton(picture, id, scope);
      return inner ? `<span class="team-flags">${inner}</span>` : "";
    }

    function gbText(leader, t) {
      const back = gamesBack(leader, t);
      return back <= 0 ? "—" : (back % 1 ? back.toFixed(1) : String(back));
    }

    function standingsLegend(picture) {
      const anyFlag = TEAM_IDS.some((id) => picture.flags[id]);
      const anyWhy = TEAM_IDS.some((id) => (picture.reasons[id] || []).length);
      if (!HAS_PLAYOFFS && !anyWhy) return "";
      const firstOther = BYES + (HAS_DIVISIONS ? Math.max(0, picture.leaders.length - BYES) : 0) + 1;
      return `<div class="standings-note">
        ${HAS_PLAYOFFS && BYES ? `<span class="legend-key"><span class="seed-tag div lead">#1</span>First-round bye</span>` : ""}
        ${HAS_PLAYOFFS && HAS_DIVISIONS && picture.leaders.length > BYES ? `<span class="legend-key"><span class="seed-tag div">#${BYES + 1}</span>Division leader</span>` : ""}
        ${HAS_PLAYOFFS && PLAYOFF_TEAMS >= firstOther ? `<span class="legend-key"><span class="seed-tag ${HAS_DIVISIONS ? "wc" : "div"}">#${firstOther}</span>${HAS_DIVISIONS ? "Wild card" : "Playoff seed"}</span>` : ""}
        ${HAS_PLAYOFFS && PLAYOFF_TEAMS < TEAM_IDS.length ? `<span class="legend-key"><span class="seed-tag out">#${PLAYOFF_TEAMS + 1}</span>${LB.length ? "Losers bracket" : "Missed the playoffs"}</span>` : ""}
        ${anyFlag ? `${CLINCH_KEY.z && TEAM_IDS.some((id) => picture.flags[id] === "z") ? `<span class="legend-key"><span class="clinch-tag z">z</span>${BYES ? "Clinched a bye" : "Clinched division"}</span>` : ""}
        <span class="legend-key"><span class="clinch-tag x">x</span>Clinched a berth</span>
        <span class="legend-key"><span class="clinch-tag e">e</span>Eliminated</span>` : ""}
        ${anyWhy ? `<span class="legend-key"><span class="why-btn" aria-hidden="true">i</span>Tap for the tiebreaker</span>` : ""}
      </div>`;
    }

    /* Tiebreaker popover ------------------------------------------- */

    let whyPop = null;

    let whyFor = null;

    function closeWhy() {
      if (whyPop) { whyPop.remove(); whyPop = null; }
      if (whyFor) { whyFor.classList.remove("open"); whyFor.setAttribute("aria-expanded", "false"); whyFor = null; }
    }

    // A second tap on the same dot closes its popover instead of reopening it.
    function openWhy(button) {
      const again = whyFor === button;
      closeWhy();
      if (again) return;
      const info = whyStore[button.dataset.why];
      if (!info) return;

      const pop = document.createElement("div");
      pop.className = "why-pop";
      pop.setAttribute("role", "dialog");
      pop.innerHTML = `
        <div class="why-head">${info.team} · ${info.entries.length} tiebreak${info.entries.length === 1 ? "" : "s"}</div>
        ${info.entries.map((e) => `
          <div class="why-entry">
            <h4>${e.race} · ${e.criterion}</h4>
            <p>${e.detail}</p>
            ${e.note ? `<div class="why-team">${e.note}</div>`
              : e.over ? `<div class="why-team">Placed ahead of ${e.over}.</div>`
              : e.under ? `<div class="why-team">Placed behind ${e.under}.</div>` : ""}
          </div>`).join("")}`;
      document.body.appendChild(pop);

      const anchor = button.getBoundingClientRect();
      const box = pop.getBoundingClientRect();
      const margin = 12;
      let left = anchor.left + anchor.width / 2 - box.width / 2;
      left = Math.max(margin, Math.min(left, window.innerWidth - box.width - margin));
      let top = anchor.bottom + 8;
      if (top + box.height > window.innerHeight - margin) top = Math.max(margin, anchor.top - box.height - 8);
      pop.style.left = `${left}px`;
      pop.style.top = `${top}px`;
      whyPop = pop;
      whyFor = button;
      button.classList.add("open");
      button.setAttribute("aria-expanded", "true");
    }

    document.addEventListener("click", (event) => {
      const button = event.target.closest(".why-btn[data-why]");
      if (button) { event.stopPropagation(); openWhy(button); return; }
      if (whyPop && !event.target.closest(".why-pop")) closeWhy();
    });

    document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeWhy(); });
    window.addEventListener("resize", closeWhy);
    window.addEventListener("scroll", closeWhy, true);

    /* =================================================================
       WEEK RAIL + VIEW TABS
       ================================================================= */

    /* A played week's ring is closed and a week still to come is an open
       track; the next week to be played carries a dot, and the playoff
       weeks are gold. Week 0 is the season overview: SZN once a season is
       finished, PRE while it is being played. */
    function renderWeekRail() {
      const playedWeek = (w) => (FINISHED ? true
        : w === 0 ? playedWeeks.length > 0
        : w > REGULAR_WEEKS ? playoffWeekPlayed(w) : isPlayed(w));
      let next = null;
      if (!FINISHED) for (let w = 1; w <= LAST_WEEK && next === null; w++) if (!playedWeek(w)) next = w;
      const weeks = [];
      for (let w = 0; w <= LAST_WEEK; w++) {
        const playoff = w > REGULAR_WEEKS, played = playedWeek(w);
        weeks.push({
          w, played, playoff, now: w === next,
          num: w === 0 ? (FINISHED ? "SZN" : "PRE") : String(w),
          label: w === 0 ? (FINISHED ? `${SEASON} season overview` : "Preseason")
            : `Week ${w}${playoff ? " · playoffs" : ""}${w === next ? " · up next" : played ? "" : " · not played yet"}`,
        });
      }
      SeasonNav.render({ weeks, week: state.week });
    }

    function renderViewTabs() {
      SeasonNav.render({ views: viewsFor(state.week), view: state.view });
      UI.roll(document.getElementById("weekTitle"), state.week === 0
        ? (FINISHED ? `${SEASON} Season` : season.unplayed ? `${SEASON} · Not played` : `Preseason · ${SEASON}`)
        : `Week ${state.week} · ${SEASON}`, SeasonNav.dir);
    }

    /* =================================================================
       RESULTS / SCHEDULE PANEL
       ================================================================= */

    function gameCard(week, a, as, b, bs) {
      const aWon = as > bs, bWon = bs > as;
      const margin = Math.abs(as - bs);
      const side = (id, score, won) => `
        <div class="game-side ${won ? "winner" : ""}">
          <span class="win-flag"></span>
          ${miniTeam(id)}
          <button type="button" class="game-team" data-team="${id}" aria-label="${nameOf(id)}: season and schedule">
            <strong>${nameOf(id)}</strong><span>${ownerOf(id)}</span>
          </button>
          <span class="game-score">${fmt(score)}</span>
        </div>`;
      return `<article class="game-card">
        <div class="game-card-head">
          <span>Final</span>
          <span class="game-margin">${as === bs ? "Tie" : `Margin ${fmt(margin)}`}</span>
        </div>
        ${side(a, as, aWon)}
        ${side(b, bs, bWon)}
      </article>`;
    }

    function weekSuperlatives(week) {
      const games = results[week] || [];
      if (!games.length) return "";
      const scores = [];
      games.forEach(([a, as, b, bs]) => { scores.push({ id: a, score: as }); scores.push({ id: b, score: bs }); });
      const byScore = scores.slice().sort((x, y) => y.score - x.score);
      const byMargin = games.slice().sort((x, y) => Math.abs(y[1] - y[3]) - Math.abs(x[1] - x[3]));
      const blowout = byMargin[0];
      const nailbiter = byMargin[byMargin.length - 1];
      const total = scores.reduce((sum, s) => sum + s.score, 0);

      const item = (label, strong, sub) => `<div class="superlative"><small>${label}</small><strong>${strong}</strong><span>${sub}</span></div>`;
      const winnerOf = (g) => (g[1] >= g[3] ? g[0] : g[2]);
      const loserOf = (g) => (g[1] >= g[3] ? g[2] : g[0]);

      return `<div class="summary-superlatives">
        ${item("High score", nameOf(byScore[0].id), fmt(byScore[0].score))}
        ${item("Low score", nameOf(byScore[byScore.length - 1].id), fmt(byScore[byScore.length - 1].score))}
        ${item("Biggest blowout", `${nameOf(winnerOf(blowout))} over ${nameOf(loserOf(blowout))}`, `by ${fmt(Math.abs(blowout[1] - blowout[3]))}`)}
        ${item("Closest game", `${nameOf(winnerOf(nailbiter))} over ${nameOf(loserOf(nailbiter))}`, `by ${fmt(Math.abs(nailbiter[1] - nailbiter[3]))}`)}
        ${item("League average", `${fmt1(total / scores.length)} per team`, `${fmt(total)} total points`)}
      </div>`;
    }

    function renderResultsPanel(week) {
      const panel = document.getElementById("panel-results");
      const weeks = Object.keys(schedule).map(Number).filter((w) => w <= REGULAR_WEEKS).sort((a, b) => a - b);

      if (week === 0) {
        if (!weeks.length) {
          panel.innerHTML = season.unplayed
            ? emptyState("This season wasn't played", "Sleeper closed it before any matchups were scored, so there is nothing to show. Earlier seasons are in the season menu.")
            : emptyState("No schedule yet", "Sleeper draws the season's matchups once the league has its teams. They will appear here as soon as it does.");
          return;
        }
        const games = weeks.reduce((n, w) => n + schedule[w].length, 0);
        panel.innerHTML = `
          <article class="card">
            ${cardHead(`${SEASON} Schedule`, "schedule", `${weeks.length} weeks · ${games} games`)}
            <div class="schedule-weeks">
              ${weeks.map((w) => `
                <div class="schedule-week-card">
                  <div class="swc-head"><span>Week ${w}</span><span>${isPlayed(w) ? "Final" : "Upcoming"}</span></div>
                  ${schedule[w].map(([a, b]) => `
                    <div class="swc-game">
                      <span class="swc-team">${nameOf(a)}</span>
                      <span class="swc-vs">VS</span>
                      <span class="swc-team right">${nameOf(b)}</span>
                    </div>`).join("")}
                </div>`).join("")}
            </div>
          </article>`;
        return;
      }

      if (isPlayed(week)) {
        panel.innerHTML = `
          <div class="panel-stack">
            <div class="score-grid">
              ${results[week].map(([a, as, b, bs]) => gameCard(week, a, as, b, bs)).join("")}
            </div>
            <article class="card">
              ${cardHead(`Week ${week} Notes`, "notes")}
              ${weekSuperlatives(week)}
            </article>
          </div>`;
        markBoxScores(week);
        return;
      }

      if (!(schedule[week] || []).length) {
        panel.innerHTML = emptyState(`No games in Week ${week}`, "Sleeper has no matchups for this league this week.");
        return;
      }

      const stats = computeStats(asOfWeek(week));
      panel.innerHTML = `
        <article class="card">
          ${cardHead(`Week ${week} Matchups`, "versus", "Not yet played")}
          <div class="projected-matchups">
            ${(schedule[week] || []).map(([a, b]) => `
              <div class="projected-game">
                <div class="pg-head">Week ${week}</div>
                <div class="pg-side">${miniTeam(a)}<span class="pg-name">${nameOf(a)}</span><span class="pg-rec">${stats[a].record}</span></div>
                <div class="pg-side">${miniTeam(b)}<span class="pg-name">${nameOf(b)}</span><span class="pg-rec">${stats[b].record}</span></div>
              </div>`).join("")}
          </div>
        </article>`;
    }

    /* =================================================================
       STANDINGS
       ================================================================= */

    function seedRowClass(picture, id, live) {
      if (!live) return "";
      const label = picture.seedLabels[id];
      if (!label) return "";
      if (label.kind === "div") return "seed-div";
      if (label.kind === "wc") return "seed-wc";
      return "seed-toilet";
    }

    /* One card per division, or one for the league. `live` is false before a
       week has been played, when every record is 0–0 and nobody is ranked. */
    function standingsCards(week, scope) {
      const live = week > 0;
      const picture = buildPicture(week);
      const stats = picture.stats;
      return DIVISION_NAMES.map((division) => {
        const ids = live ? picture.divisions[division] : divisionOrder[division];
        const title = HAS_DIVISIONS ? esc(division) : LEAGUE_TABLE;

              <tbody>
                ${ids.map((id, i) => {

    function renderStandingsPanel(week) {

      const picture = buildPicture(asOf);

        <div class="panel-stack">
