    // The season overview's regular-season tables, as they finished.
    function renderDivisions() {
      const week = asOfWeek(REGULAR_WEEKS);
      document.getElementById("divisionGrid").innerHTML = standingsCards(week, "season");
      const note = document.getElementById("regularLegend");
      if (note) note.innerHTML = week > 0 ? standingsLegend(buildPicture(week)) : "";
    }

    /* =================================================================
       FINAL STANDINGS (a finished season)
       ================================================================= */

    const finalOrder = TEAM_IDS.slice().sort((a, b) => (teams[a].finalRank || 99) - (teams[b].finalRank || 99));
    const gamesOf = (t) => Math.max(1, t.wins + t.losses + t.ties - (MEDIAN ? playedWeeks.length : 0));
    const diffPerGame = (t) => (t.pf - t.pa) / gamesOf(t);
    const recordOf = (t) => (t.ties ? `${t.wins}–${t.losses}–${t.ties}` : `${t.wins}–${t.losses}`);

    let finalSort = { key: "finalRank", direction: "asc" };

    const finalSortDefaults = {
      finalRank: "asc",
      team: "asc",
      record: "desc",
      pf: "desc",
      pa: "asc",
      pfg: "desc",
      pag: "asc",
      diff: "desc"
    };

    function finalSortValue(id, key) {
      const t = teams[id];
      if (key === "team") return t.name.toLowerCase();
      if (key === "record") return t.wins + t.ties / 2;
      if (key === "pfg") return t.pf / gamesOf(t);
      if (key === "pag") return t.pa / gamesOf(t);
      if (key === "diff") return diffPerGame(t);
      return t[key];
    }

    function renderFinalStandings() {
      const medals = ["🏆", "🥈", "🥉"];
      const sortedIds = [...finalOrder].sort((a, b) => {
        const aValue = finalSortValue(a, finalSort.key);
        const bValue = finalSortValue(b, finalSort.key);

        let comparison;
        if (typeof aValue === "string") {
          comparison = aValue.localeCompare(bValue);
        } else {
          comparison = aValue - bValue;
        }

        if (comparison !== 0) {
          return finalSort.direction === "asc" ? comparison : -comparison;
        }

        if (finalSort.key === "record" && teams[a].losses !== teams[b].losses) {
          return teams[a].losses - teams[b].losses;
        }

        return (teams[a].finalRank || 99) - (teams[b].finalRank || 99);
      });

      document.getElementById("finalStandingsBody").innerHTML = sortedIds.map((id) => {
        const t = teams[id];
        const d = diffPerGame(t);
        const medal = medals[t.finalRank - 1] || "";
        return `<tr class="${t.finalRank === 1 ? "champion-row" : ""}">
          <td class="rank"><span class="place-medal">${medal}</span>${t.finalRank || "–"}</td>
          <td class="team-cell">
            ${teamButton(id)}
            <div class="mobile-stat-strip" aria-label="${nameOf(id)} final standings statistics">
              <span class="mobile-stat"><small>W–L</small><strong>${recordOf(t)}</strong></span>
              <span class="mobile-stat"><small>PF</small><strong>${fmt(t.pf)}</strong></span>
              <span class="mobile-stat"><small>PA</small><strong>${fmt(t.pa)}</strong></span>
              <span class="mobile-stat"><small>PF/G</small><strong>${(t.pf / gamesOf(t)).toFixed(1)}</strong></span>
              <span class="mobile-stat"><small>DIFF</small><strong class="${d >= 0 ? "positive" : "negative"}">${d >= 0 ? "+" : ""}${d.toFixed(1)}</strong></span>
            </div>
          </td>
          <td class="record">${recordOf(t)}</td>
          <td>${fmt(t.pf)}</td>
          <td>${fmt(t.pa)}</td>
          <td>${(t.pf / gamesOf(t)).toFixed(1)}</td>
          <td>${(t.pa / gamesOf(t)).toFixed(1)}</td>
          <td class="${d >= 0 ? "positive" : "negative"}">${d >= 0 ? "+" : ""}${d.toFixed(1)}</td>
        </tr>`;
      }).join("");

      const mobileFinalSort = document.getElementById("mobileFinalSort");
      if (mobileFinalSort) mobileFinalSort.value = finalSort.key;
      const mobileFinalDirection = document.getElementById("mobileFinalDirection");
      if (mobileFinalDirection) {
        mobileFinalDirection.textContent = finalSort.direction === "asc" ? "↑" : "↓";
        mobileFinalDirection.setAttribute("aria-label", finalSort.direction === "asc" ? "Sort ascending" : "Sort descending");
      }

      document.querySelectorAll("#final .sort-button").forEach((button) => {
        const active = button.dataset.sort === finalSort.key;
        button.classList.toggle("active", active);
        button.querySelector(".sort-indicator").textContent =
          active ? (finalSort.direction === "asc" ? "↑" : "↓") : "";
        const th = button.closest("th");
        th.setAttribute("aria-sort", active
          ? (finalSort.direction === "asc" ? "ascending" : "descending")
          : "none");
      });
    }

    document.querySelectorAll("#final .sort-button").forEach((button) => {
      button.addEventListener("click", () => {
        const key = button.dataset.sort;
        if (finalSort.key === key) {
          finalSort.direction = finalSort.direction === "asc" ? "desc" : "asc";
        } else {
          finalSort = { key, direction: finalSortDefaults[key] };
        }
        renderFinalStandings();
      });
    });

    document.getElementById("mobileFinalSort").addEventListener("change", (event) => {
      const key = event.target.value;
      finalSort = { key, direction: finalSortDefaults[key] };
      renderFinalStandings();
    });

    document.getElementById("mobileFinalDirection").addEventListener("click", () => {
      finalSort.direction = finalSort.direction === "asc" ? "desc" : "asc";
      renderFinalStandings();
    });

    /* =================================================================
       BRACKETS

       Drawn from Sleeper's own brackets, whatever their shape: four teams
       or sixteen, byes or none, one week a round or two. The winner's
       bracket is a tree: the title game on the right, each round to its
       left twice as tall, each game centred between the two it is fed by,
       and a team with a bye sitting out the rounds before it enters. On a
       phone it becomes two lanes, one per half, that meet at the title
       game. The losers bracket keeps its own routes, written on each game.

       Three ways of reading the same bracket:
         as of a week      played games show their scores; games after the
                           week show who is in them, or what will decide it
         projected         the bracket as it would be seeded if the regular
                           season ended now, with records instead of scores
       ================================================================= */

    function bkTeam(id) {
      const t = teams[id];
      return `<button type="button" class="mini-team bracket-team-button" data-team="${id}" aria-label="Open ${nameOf(id)} schedule"><span class="mini-badge" style="--team-color:${t.color}">${teamMark(t)}</span><span class="bracket-team-name">${nameOf(id)}</span></button>`;
    }

    const bkRow = (seed, id, stats) =>
      `<div class="matchup-row projected"><span class="seed">${seed}</span>${bkTeam(id)}<span class="bk-rec">${stats[id].record}</span></div>`;

    const bkTbd = (label) =>
      `<div class="matchup-row bk-tbd"><span class="seed">—</span><span class="bk-tbd-name">${label}</span><span></span></div>`;

    function bkGame(rows, { cls = "", kicker = "", path = "", week = 0, stage = "" } = {}) {
      return `<div class="matchup${cls ? ` ${cls}` : ""}"${week ? ` data-week="${week}"` : ""}${stage ? ` data-stage="${stage}"` : ""}>${kicker ? `<div class="matchup-kicker">${kicker}</div>` : ""}${rows.join("")}${path ? `<div class="matchup-path">${path}</div>` : ""}</div>`;
    }

    const bkRound = (n, title, week, games, extra = "") =>
      `<div class="round round-${n}${extra}"><div class="round-title"><strong>${title}</strong><span>${week}</span></div><div class="round-games"${extra ? ` style="--slots:${games.slots || 1}"` : ""}>${games.join("")}</div></div>`;

    const bkHead = (title, note) =>
      `<div class="bracket-head"><div><h3>${title}</h3></div>${note ? `<span class="bk-note">${note}</span>` : ""}</div>`;

    /* The seeding a bracket was drawn from: the regular season's final
       order once it is over, otherwise the latest. A team's seed in a
       bracket is its place among that bracket's own teams, so the winner's
       bracket reads #1 upwards and the losers bracket carries on from the
       last playoff seed. */
    const drawnFrom = () => buildPicture(asOfWeek(REGULAR_WEEKS)).seeds;
    function entrantsOf(raw) {
      const set = new Set();
      raw.forEach((g) => [g.t1, g.t2].forEach((rid) => { if (rid != null && teams[`r${rid}`]) set.add(`r${rid}`); }));
      const order = drawnFrom();
      return [...set].sort((a, b) => order.indexOf(a) - order.indexOf(b));
    }
    const WB_ENTRANTS = entrantsOf(WB);
    const LB_BASE = WB_ENTRANTS.length || PLAYOFF_TEAMS;

    /* The winner's bracket as a tree, from the title game (p = 1) down.
       Each side of a game is the game that feeds it, a team entering the
       bracket there (a bye), or open. A reseeded bracket does not say which
       game feeds which until it is played, so its unplayed games are hung
       on the open slots in order. */
    function winnersTree() {
      if (!WB.length) return null;
      const byM = new Map(WB.map((g) => [g.m, g]));
      const final = WB.find((g) => g.p === 1) || WB.filter((g) => g.r === WB_ROUNDS && !g.p)[0];
      if (!final) return null;
      const used = new Set();
      const nodes = new Map();
      const build = (g) => {
        used.add(g.m);
        const node = { g, sides: [] };
        nodes.set(g.m, node);
        node.sides = [1, 2].map((n) => {
          const from = g[`t${n}_from`];
          const rid = g[`t${n}`];
          if (from && from.w != null && byM.has(from.w) && !used.has(from.w)) return { child: build(byM.get(from.w)) };
          if (rid != null) {
            const feeder = WB.find((x) => x.r < g.r && !x.p && !used.has(x.m) && x.w === rid);
            if (feeder) return { child: build(feeder) };
            return { team: `r${rid}` };
          }
          return { open: true };
        });
        return node;
      };
      const root = build(final);
      const orphans = WB.filter((g) => !used.has(g.m) && !g.p).sort((a, b) => b.r - a.r || a.m - b.m);
      const queue = [root];
      while (queue.length) {
        const node = queue.shift();
        node.sides.forEach((side, i) => {
          if (side.open) {
            const k = orphans.findIndex((o) => o.r === node.g.r - 1 && !used.has(o.m));
            if (k >= 0) node.sides[i] = { child: build(orphans.splice(k, 1)[0]) };
          }
          if (node.sides[i].child) queue.push(node.sides[i].child);
        });
      }
      return { root, nodes, third: WB.find((g) => g.p === 3) || null };
    }
    const TREE = winnersTree();

    /* The three readings. `asOf` is the last week whose games count;
       `map` turns a team Sleeper has in a slot into the team shown there;
       `seed` is the number beside a team. */
    function bracketContext(mode, week) {
      if (mode === "projected") {
        const picture = buildPicture(week);
        const drawn = drawnFrom();
        // A winner's bracket slot holds a playoff seed; any other slot, a
        // place in the standings (a toilet bowl takes the bottom of them).
        const slotSeed = (id) => {
          const inWB = WB_ENTRANTS.indexOf(id);
          return inWB >= 0 ? inWB : drawn.indexOf(id);
        };
        return {
          projected: true, asOf: 0, stats: picture.stats,
          map: (id) => picture.seeds[slotSeed(id)] || id,
          seed: (id) => `#${picture.seeds.indexOf(id) + 1}`,
        };
      }
      const stats = buildPicture(asOfWeek(REGULAR_WEEKS)).stats;
      return {
        projected: false, asOf: week, stats,
        map: (id) => id,
        seed: (id) => {
          const w = WB_ENTRANTS.indexOf(id);
          if (w >= 0) return `#${w + 1}`;
          const place = drawnFrom().indexOf(id);
          return place >= 0 ? `#${place + 1}` : "";
        },
      };
    }

    // The result of a bracket game as of the context's week, or null.
    function resultOf(bracket, m, ctx) {
      if (ctx.projected) return null;
      const game = postOf(bracket, m);
      if (!game || !game.played || game.week > ctx.asOf || !game.a || !game.b) return null;
      return game;
    }

    /* Who fills one side of a winner's bracket game: a team, or a label
       for the game that will decide it. */
    function wbSide(side, ctx) {
      if (side.team) return { id: ctx.map(side.team) };
      if (side.child) {
        const res = resultOf("W", side.child.g.m, ctx);
        if (res) return { id: res.winner };
        return { label: `Winner of ${describeWB(side.child, ctx)}` };
      }
      return { label: "To be decided" };
    }
    /* "#4 vs #5" once both teams are known; before that, the game is named
       for the best seed on its side of the bracket ("#1's semifinal"). */
    function describeWB(node, ctx) {
      const sides = node.sides.map((s) => wbSide(s, ctx));
      if (sides.every((s) => s.id)) return `${ctx.seed(sides[0].id)} vs ${ctx.seed(sides[1].id)}`;
      const name = League.gameName(node.g.r, WB_ROUNDS).toLowerCase();
      const top = topSeedIn(node, ctx);
      return top ? `${top}'s ${name}` : `the ${name}`;
    }
    function topSeedIn(node, ctx) {
      const seeds = [];
      const walk = (n) => n.sides.forEach((s) => {
        if (s.team) seeds.push(parseInt(ctx.seed(ctx.map(s.team)).slice(1), 10));
        if (s.child) walk(s.child);
      });
      walk(node);
      const known = seeds.filter(Number.isFinite);
      return known.length ? `#${Math.min(...known)}` : "";
    }

    // One team's row in a game: its score once played, its record before.
    function bkSideRow(slot, game, ctx, { lastPlace = false } = {}) {
      if (!slot.id) return bkTbd(slot.label);
      const seed = ctx.seed(slot.id);
      if (!game) return bkRow(seed, slot.id, ctx.stats);
      const score = game.a === slot.id ? game.aScore : game.bScore;
      const won = game.winner === slot.id;
      return `<div class="matchup-row${won ? " winner" : ""}${lastPlace && game.loser === slot.id ? " last-place-row" : ""}"><span class="seed">${seed}</span>${bkTeam(slot.id)}<span class="score">${fmt(score)}</span></div>`;
    }

    function wbGameHtml(node, ctx, opts = {}) {
      const res = resultOf("W", node.g.m, ctx);
      const sides = node.sides.map((s) => wbSide(s, ctx));
      const rows = sides.map((slot) => bkSideRow(slot, res, ctx));
      return bkGame(rows, { ...opts, week: res ? res.week : 0 });
    }

    // A bye: the team waits out the round, a berth rather than a win.
    function byeHtml(id, ctx, mobile) {
      const seed = ctx.seed(id);
      const row = ctx.projected
        ? bkRow(seed, id, ctx.stats)
        : `<div class="matchup-row winner"><span class="seed">${seed}</span>${bkTeam(id)}<span></span></div>`;
      return mobile
        ? `<div class="matchup mobile-bye-card"><div class="matchup-kicker">${seed} Seed · Bye</div>${row}</div>`
        : `<div class="matchup bye">${row}<div class="bye-label">Bye</div></div>`;
    }

    /* The tree laid out by round: column c (1 = the first round) holds
       2^(rounds - c) slots, each a game, a bye or nothing. */
    function treeGrid() {
      const R = WB_ROUNDS;
      const grid = [];
      for (let c = 1; c <= R; c++) grid[c] = new Array(2 ** (R - c)).fill(null);
      const place = (node, col, slot) => {
        if (col < 1) return;
        grid[col][slot] = { node };
        node.sides.forEach((side, i) => {
          const childSlot = slot * 2 + i;
          if (side.child) place(side.child, col - 1, childSlot);
          else if (side.team && col - 1 >= 1) grid[col - 1][childSlot] = { bye: side.team };
        });
      };
      place(TREE.root, R, 0);
      return grid;
    }

    function winnersCard(ctx, { note, label }) {
      if (!TREE) return "";
      const R = WB_ROUNDS;
      const grid = treeGrid();
      const weeksOf = (c) => weeksText(S.weeksPerRound(c));
      const cell = (entry, mobile, opts = {}) => {
        if (!entry) return mobile ? "" : `<div class="bk-slot" aria-hidden="true"></div>`;
        if (entry.bye) return byeHtml(ctx.map(entry.bye), ctx, mobile);
        return wbGameHtml(entry.node, ctx, opts);
      };
      const third = TREE.third
        ? (() => {
          const g = TREE.third;
          const res = resultOf("W", g.m, ctx);
          // Its teams are the semifinal losers.
          const loserOf = (from) => {
            if (!from || from.l == null) return { label: "Semifinal loser" };
            const semi = resultOf("W", from.l, ctx);
            if (semi) return { id: semi.loser };
            const node = TREE.nodes.get(from.l);
            return { label: node ? `Loser of ${describeWB(node, ctx)}` : "Semifinal loser" };
          };
          const slots = ctx.projected || !res
            ? [loserOf(g.t1_from), loserOf(g.t2_from)]
            : [{ id: res.a }, { id: res.b }];
          return (cls) => bkGame(slots.map((s) => bkSideRow(s, res, ctx)), { cls, kicker: "Third Place", week: res ? res.week : 0 });
        })()
        : null;

      // Desktop: one column per round, joined by connector brackets.
      const columns = [];
      for (let c = 1; c <= R; c++) {
        const slots = grid[c];
        const games = slots.map((entry) => cell(entry, false, c === R ? { cls: "championship-matchup" } : {}));
        if (c === R && third) games.push(third("third-place-matchup"));
        if (c > 1) {
          const below = grid[c - 1].length;
          slots.forEach((entry, j) => {
            if (!entry || !entry.node || !grid[c - 1][2 * j] || !grid[c - 1][2 * j + 1]) return;
            games.push(`<i class="bk-join" aria-hidden="true" style="top:${((2 * j + 0.5) / below * 100).toFixed(3)}%;height:${(100 / below).toFixed(3)}%"></i>`);
          });
        }
        games.slots = slots.length;
        columns.push(bkRound(c, League.roundName(c, R), weeksOf(c), games, `${c === R ? " round-last" : ""} bk-col`));
      }

      /* Phones: the two halves of the bracket as lanes. Every round before
         the title game is a stage; the last of them drops into the lines
         that meet at the title game. */
      const half = (c, lane) => {
        const slots = grid[c];
        const n = slots.length / 2;
        return slots.slice(lane * n, lane * n + n);
      };
      const laneLabel = (lane) => {
        const ids = [];
        for (let c = 1; c < R; c++) half(c, lane).forEach((e) => {
          if (!e) return;
          if (e.bye) ids.push(ctx.map(e.bye));
          else e.node.sides.forEach((s) => { if (s.team) ids.push(ctx.map(s.team)); });
        });
        const seeds = ids.map((id) => parseInt(ctx.seed(id).slice(1), 10)).filter(Number.isFinite);
        return seeds.length ? `#${Math.min(...seeds)} Seed Side` : lane ? "Bottom Half" : "Top Half";
      };
      const stages = [];
      for (let c = 1; c < R; c++) {
        const title = `<div class="mobile-stage-title"><strong>${League.roundName(c, R)}</strong><span>${weeksOf(c)}</span></div>`;
        if (c < R - 1) {
          stages.push(`<section class="mobile-bracket-stage opening-stage">
              ${title}
              <div class="mobile-lane-grid">
                ${[0, 1].map((lane) => `<div class="mobile-bracket-lane">${c === 1 ? `<div class="mobile-lane-label">${laneLabel(lane)}</div>` : ""}${half(c, lane).map((e) => cell(e, true)).join("")}</div>`).join("")}
              </div>
            </section>`);
        } else {
          const stage = `${League.gameName(c, R)} · ${weeksOf(c)}`;
          stages.push(`<section class="mobile-bracket-stage semifinal-stage${c === 1 ? " first-stage" : ""}">
              ${title}
              <div class="mobile-lane-grid">
                ${[0, 1].map((lane) => `<div class="mobile-bracket-lane mobile-semifinal-lane">${half(c, lane).map((e) => cell(e, true, { stage })).join("")}</div>`).join("")}
              </div>
              <div class="mobile-merge-lines" aria-hidden="true"><span></span><span></span></div>
            </section>`);
        }
      }
      const finalNode = grid[R][0];
      stages.push(`<section class="mobile-bracket-stage championship-stage">
              <div class="mobile-stage-title"><strong>${League.roundName(R, R)}</strong><span>${weeksOf(R)}</span></div>
              ${finalNode ? wbGameHtml(finalNode.node, ctx, { cls: "championship-matchup mobile-championship-card" }) : ""}
              ${third ? third("third-place-matchup mobile-third-place-card") : ""}
            </section>`);

      const rows = grid[1].length;
      return `
        <div class="card bracket-card winners-card">
          ${bkHead("Winner's Bracket", note)}
          <div class="bracket-scroll">
            <div class="bracket winners-bracket" style="--rows:${rows};--cols:${R}">
              ${columns.join("")}
            </div>
          </div>
          <div class="mobile-winner-tree" aria-label="${label}">
            ${stages.join("")}
          </div>
        </div>`;
    }

    /* The losers bracket, one column per round. Each game names where its
       teams go next, and the game that settles last place says so.

       In a toilet bowl (Sleeper's default) the team that loses goes on:
       Sleeper's "winner of game m" is whoever lost it, and the loser of the
       last game standing is last in the league. In a consolation bracket
       the winners go on and the places count on from the playoff field. */
    const TOILET = Boolean(S.toiletBowl);
    function losersCard(ctx, { note }) {
      if (!LB.length) return "";
      const N = TEAM_IDS.length;
      // Places a p game settles: [the winner's, the loser's].
      const placesOf = (g) => (TOILET ? [N - g.p, N - g.p + 1] : [LB_BASE + g.p, LB_BASE + g.p + 1]);
      const lastPlaceGame = LB.filter((g) => g.p && placesOf(g)[1] === N)[0] || null;
      // Sleeper's `w` is whoever went on: in a toilet bowl, the team that lost.
      const goesOn = TOILET ? "Loser" : "Winner", staysBack = TOILET ? "Winner" : "Loser";
      const routes = (g) => {
        if (g.p) {
          const [hi, lo] = placesOf(g);
          return lo === N ? "Loser = last place in the league" : `Winner ${League.ordinal(hi)} · Loser ${League.ordinal(lo)}`;
        }
        const to = (key) => LB.filter((x) => [x.t1_from, x.t2_from].some((f) => f && f[key] === g.m)).map((x) => x.m);
        const on = to("w"), back = to("l");
        return [on.length ? `${goesOn} → Game ${on[0]}` : "", back.length ? `${staysBack} → Game ${back[0]}` : ""].filter(Boolean).join(" · ");
      };
      const lbSide = (g, n) => {
        const from = g[`t${n}_from`], rid = g[`t${n}`];
        if (from && (from.w != null || from.l != null)) {
          const m = from.w != null ? from.w : from.l;
          const wentOn = from.w != null;
          const res = resultOf("L", m, ctx);
          if (res) return { id: wentOn ? res.advanced : (res.advanced === res.winner ? res.loser : res.winner) };
          return { label: `${wentOn ? goesOn : staysBack} of Game ${m}` };
        }
        if (rid != null && teams[`r${rid}`]) return { id: ctx.map(`r${rid}`) };
        return { label: "To be decided" };
      };
      const rounds = [];
      for (let r = 1; r <= LB_ROUNDS; r++) {
        const games = LB.filter((g) => g.r === r).sort((a, b) => a.m - b.m).map((g) => {
          const res = resultOf("L", g.m, ctx);
          const slots = [lbSide(g, 1), lbSide(g, 2)];
          const last = g === lastPlaceGame;
          return bkGame(slots.map((s) => bkSideRow(s, res, ctx, { lastPlace: last })), {
            cls: last ? "last-place-matchup" : "", kicker: `Game ${g.m}`, path: routes(g), week: res ? res.week : 0,
          });
        });
        const title = r === 1 ? "Opening Round" : r === LB_ROUNDS ? "Final Round" : `Round ${r}`;
        rounds.push(bkRound(r, title, weeksText(S.weeksPerRound(r)), games));
      }
      return `
        <div class="card bracket-card losers-card">
          ${bkHead("Losers Bracket", note)}
          <div class="bracket-scroll">
            <div class="bracket losers-bracket${LB_ROUNDS === 2 ? " two-round-bracket" : ""}">
              ${rounds.join("")}
            </div>
          </div>
        </div>`;
    }

    function updateBracketNameAlignment() {
      requestAnimationFrame(() => {
        document.querySelectorAll(".bracket-team-name").forEach((name) => {
          name.classList.remove("multiline");
          const styles = window.getComputedStyle(name);
          const lineHeight = parseFloat(styles.lineHeight);
          const isVisible = name.getClientRects().length > 0;
          if (!isVisible || !Number.isFinite(lineHeight)) return;
          const wraps = name.scrollHeight > lineHeight * 1.45;
          name.classList.toggle("multiline", wraps);
        });
      });
    }

    window.addEventListener("resize", updateBracketNameAlignment);

    /* How the field is set, in the league's own terms, for the weeks before
       there is anything to project. */
    function formatCard() {
      const n = TEAM_IDS.length;
      const lines = [];
      if (HAS_PLAYOFFS) {
        for (let r = 1; r <= WB_ROUNDS; r++) {
          const games = WB.filter((g) => g.r === r && (!g.p || g.p === 1)).length;
          let text;
          if (r === WB_ROUNDS) text = `The championship${LB.length ? ", with the third-place game alongside it" : ""}.`;
          else if (r === 1 && BYES) text = `The top ${numberWord(BYES)} seed${BYES === 1 ? "" : "s"} rest${BYES === 1 ? "s" : ""}. The other ${numberWord(games * 2)} play ${numberWord(games)} game${games === 1 ? "" : "s"}.`;
          else text = `${capital(numberWord(games))} game${games === 1 ? "" : "s"}; the winners move on.`;
          lines.push({ head: weeksText(S.weeksPerRound(r)).replace(/^NFL /, ""), text });
        }
      }
      return `
        <article class="card">
          ${cardHead("How the field is set", "rulebook", "From the league's Sleeper settings")}
          <div class="projected-matchups">
            ${lines.map((l) => `
              <div class="projected-game">
                <div class="pg-head">${l.head}</div>
                <div class="pg-bye">${l.text}</div>
              </div>`).join("")}
          </div>
        </article>`;
    }

    function playoffFormatText() {
      const n = TEAM_IDS.length;
      const P = PLAYOFF_TEAMS;
      const parts = [`${capital(numberWord(P))} of the ${numberWord(n)} teams make the playoffs`];
      if (HAS_DIVISIONS) parts[0] += `, every division leader among them`;
      let text = `${parts[0]}, seeded on record with points for as the tiebreaker.`;
      if (BYES) text += ` The top ${numberWord(BYES)} seed${BYES === 1 ? " gets" : "s get"} a first-round bye.`;
      if (LB.length) text += TOILET
        ? ` The other ${numberWord(n - P)} play a toilet bowl, where the team that loses moves on and the last one left finishes last.`
        : ` The other ${numberWord(n - P)} play a consolation bracket for the places after them.`;
      text += ` Once results are posted, this tab shows where every team would land if the season ended that day.`;
      return text;
    }

    function renderPicturePanel(week) {
      const asOf = asOfWeek(week);
      const panel = document.getElementById("panel-picture");

      if (asOf === 0 || !HAS_PLAYOFFS) {
        panel.innerHTML = `
          <div class="panel-stack">
            ${emptyState(HAS_PLAYOFFS ? "The bracket opens after Week 1" : "No playoffs set up",
              HAS_PLAYOFFS ? playoffFormatText() : "This league has no playoff bracket on Sleeper.")}
            ${HAS_PLAYOFFS ? formatCard() : ""}
          </div>`;
        return;
      }

      const picture = buildPicture(asOf);
      const note = asOf >= REGULAR_WEEKS ? "Final seeding" : `Projected · through Week ${asOf}`;
      const ctx = bracketContext("projected", asOf);

      const flipNote = picture.flips.length
        ? `<div class="tag-row" style="padding:0">${picture.flips.map(([a, b]) =>
            `<span class="rule-tag flip">Level on record and points · ${nameOf(a)} / ${nameOf(b)}</span>`).join("")}</div>`
        : "";

      panel.innerHTML = `
        <div class="panel-stack">
          ${winnersCard(ctx, { note, label: "Projected winner's bracket" })}
          ${flipNote}
          ${losersCard(ctx, { note })}
        </div>`;
      updateBracketNameAlignment();
    }

    /* A playoff week: the bracket as it stood when that week's games went
       final. Until the regular season is over, the field is projected. */
    function renderPlayoffPanel(week) {
      const panel = document.getElementById("panel-playoffs");
      if (!HAS_PLAYOFFS) { panel.innerHTML = emptyState("No playoffs", "This league has no playoff bracket on Sleeper."); return; }
      if (lastPlayedWeek < REGULAR_WEEKS && !FINISHED) {
        const asOf = asOfWeek(REGULAR_WEEKS);
        if (asOf === 0) {
          panel.innerHTML = `<div class="panel-stack">${emptyState("The bracket fills in once games are played",
            `The playoffs run from Week ${S.playoffWeekStart} to Week ${LAST_WEEK}. Until the regular season ends, the field is projected from the latest standings.`)}</div>`;
          return;
        }
        const ctx = bracketContext("projected", asOf);
        const note = `Projected · through Week ${asOf}`;
        panel.innerHTML = `<div class="panel-stack">${winnersCard(ctx, { note, label: `Week ${week} winner's bracket` })}${losersCard(ctx, { note })}</div>`;
        updateBracketNameAlignment();
        return;
      }
      const ctx = bracketContext("asOf", week);
      const status = week > lastPlayoffWeek()
        ? "Upcoming"
        : week >= LAST_WEEK && FINISHED ? "Final" : `Through Week ${week}`;
      panel.innerHTML = `<div class="panel-stack">${winnersCard(ctx, { note: status, label: `Week ${week} winner's bracket` })}${losersCard(ctx, { note: status })}</div>`;
      markBracketBoxScores();
      updateBracketNameAlignment();
    }

    // The season overview's bracket, as it finished.
    function renderSeasonBracket() {
      const ctx = bracketContext("asOf", LAST_WEEK);
      document.getElementById("bracket").innerHTML = `${winnersCard(ctx, { note: "", label: `${SEASON} winner's bracket` })}${losersCard(ctx, { note: "" })}`;
      markBracketBoxScores();
    }

    /* =================================================================
       BOX SCORES

       Player-level lineups for a week, built from Sleeper's matchups the
       first time someone opens one. The club beside a player is his NFL
       club today, from the site's daily copy of Sleeper's players file.
       ================================================================= */

    const boxWeeks = () => model.boxWeeks(SEASON);
    const boxWeekCache = {};
    function boxWeek(week) {
      if (!boxWeekCache[week]) boxWeekCache[week] = model.boxWeek(SEASON, week).catch(() => null);
      return boxWeekCache[week];
    }
    window.boxWeeks = boxWeeks;

    /* One visible, labelled button per game opens its box score, rather than
       the whole card: the team rows in the same card open the team's season,
       and a card that did both depending on where it was tapped left no way
       to tell which was which. */
    function bxButton(week, a, b, cls) {
      return `<button type="button" class="${cls}" data-bx-week="${week}" data-bx-a="${a}" data-bx-b="${b}"
        aria-label="Box score: ${nameOf(a)} versus ${nameOf(b)}">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M2.5 6.2h11M6.2 6.2v7.3"/></svg>
        <span>Box score</span><i aria-hidden="true">›</i>
      </button>`;
    }

    function markBoxScores(week) {
      const panel = document.getElementById("panel-results");
      if (!panel) return;
      boxWeeks().then((weeks) => {
        if (!weeks.has(week) || state.week !== week) return;
        panel.querySelectorAll(".game-card").forEach((card) => {
          if (card.classList.contains("bx-has")) return;
          const ids = [...card.querySelectorAll("[data-team]")].map((el) => el.dataset.team);
          if (ids.length !== 2) return;
          card.classList.add("bx-has");
          card.insertAdjacentHTML("beforeend", bxButton(week, ids[0], ids[1], "bx-open"));
        });
      });
    }

    /* The first name abbreviated; at phone widths it is the difference
       between reading the row and eliding it. Defences carry no first name. */
    function bxShortName(name) {
      const parts = name.split(" ");
      if (parts.length < 2 || /D\/ST$/.test(name)) return name;
      return `${parts[0].charAt(0)}. ${parts.slice(1).join(" ")}`;
    }

    /* The club as a coloured abbreviation chip; free agents in grey. */
    function bxClub(abbr) {
      const c = NFL_TEAMS[abbr] || NFL_TEAMS.FA;
      return `<span class="bx-nfl" style="background:${c};color:${readableInk(c)}">${abbr || "FA"}</span>`;
    }

    function bxPlayer(player, side) {
      if (!player) return `<div class="bx-p bx-${side}"></div>`;
      // The club sits on the outside edge: before the name on the left team,
      // after it on the right.
      const club = bxClub(player.nfl);
      return `<div class="bx-p bx-${side}">
        ${side === "l" ? club : ""}
        <span class="bx-name" data-player="${encodeURIComponent(player.id)}" tabindex="0" role="button" title="${esc(player.name)}">${esc(bxShortName(player.name))}</span>
        ${side === "r" ? club : ""}
        ${player.injury ? `<span class="bx-inj" title="${player.injury}">${player.injury.charAt(0)}</span>` : ""}
      </div>`;
    }

    function bxScore(player) {
      if (!player) return `<div class="bx-sc"></div>`;
      return `<div class="bx-sc"><b>${fmt(player.pts)}</b><small>${player.proj == null ? "" : fmt(player.proj)}</small></div>`;
    }

    /* Both teams field the same slots in the same order, so pairing by
       index lines the row up with its slot. The bench does not pair that
       neatly — one side can carry more — so a missing player leaves an empty
       cell rather than shifting the other team's row out of line. */
    function bxGroup(label, left, right) {
      const rows = Math.max(left.length, right.length);
      if (!rows) return "";
      let out = `<div class="bx-row bx-grouphead">
        <div class="bx-p"><span class="bx-glabel">${label}</span></div>
        <div class="bx-sc"></div><div class="bx-slot"></div><div class="bx-sc"></div>
        <div class="bx-p"></div>
      </div>`;
      for (let i = 0; i < rows; i++) {
        const l = left[i] || null, r = right[i] || null;
        const slot = (l || r).slot;
        out += `<div class="bx-row">
          ${bxPlayer(l, "l")}
          ${bxScore(l)}
          <div class="bx-slot">${slot}</div>
          ${bxScore(r)}
          ${bxPlayer(r, "r")}
        </div>`;
      }
      return out;
    }

    /* A bracket game carries its week once it has been played, so its box
       score is the one for that week (the last, for a two-week round). */
    function markBracketBoxScores() {
      const cells = document.querySelectorAll(".matchup[data-week]");
      if (!cells.length) return;
      boxWeeks().then((weeks) => {
        cells.forEach((matchup) => {
          if (matchup.classList.contains("bx-has")) return;
          const ids = [...matchup.querySelectorAll("[data-team]")].map((el) => el.dataset.team);
          if (ids.length !== 2) return;                       // a bye has one side
          const week = Number(matchup.dataset.week);
          if (!weeks.has(week)) return;
          matchup.classList.add("bx-has");
          matchup.insertAdjacentHTML("beforeend", bxButton(week, ids[0], ids[1], "bx-cue-row"));
        });
      });
    }

    const bxModal = document.getElementById("bxModal");
    const bxBackdrop = document.getElementById("bxBackdrop");

    function closeBox() {
      if (!bxModal) return;
      bxModal.classList.remove("open");
      bxBackdrop.classList.remove("open");
      bxModal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = document.querySelector(".team-drawer.open") ? "hidden" : "";
    }

    function openBox(week, idA, idB) {
      if (!bxModal) return;
      boxWeek(week).then((data) => {
        if (!data) return;
        const game = data.games.find((g) =>
          (g.home === idA && g.away === idB) || (g.home === idB && g.away === idA));
        if (!game) return;

        const scoreOf = (id) => (game.home === id ? game.homeScore : game.awayScore);
        // Columns follow the order of the card that was clicked, so the modal
        // reads the same way round as the thing the reader just pressed.
        const a = { id: idA, score: scoreOf(idA) };
        const b = { id: idB, score: scoreOf(idB) };

        // The header is just the season and week; the teams and the score are
        // the first row underneath. A playoff game adds its round.
        const round = season.postseason.find((g) => g.weeks.includes(week) &&
          ((g.a === idA && g.b === idB) || (g.a === idB && g.b === idA)));
        document.getElementById("bxTitle").textContent = `${SEASON} · Week ${week}`;
        document.getElementById("bxSub").textContent = round ? round.label : "";

        const lu = (id, test) => (game.lineups[id] || []).filter(test);
        const starters = (p) => p.starter;
        const benched = (p) => !p.starter && p.slot === "BE";
        const reserve = (p) => p.slot === "IR";

        document.getElementById("bxCols").innerHTML = `
          <div class="bx-sb">
            <div class="bx-p bx-l">${miniTeam(a.id)}<span class="bx-name">${nameOf(a.id)}</span></div>
            <div class="bx-sc bx-total${a.score > b.score ? " bx-won" : ""}"><b>${fmt(a.score)}</b></div>
            <div class="bx-slot"></div>
            <div class="bx-sc bx-total${b.score > a.score ? " bx-won" : ""}"><b>${fmt(b.score)}</b></div>
            <div class="bx-p bx-r"><span class="bx-name">${nameOf(b.id)}</span>${miniTeam(b.id)}</div>
          </div>
          ${bxGroup("Starters", lu(a.id, starters), lu(b.id, starters))}
          ${bxGroup("Bench", lu(a.id, benched), lu(b.id, benched))}
          ${bxGroup("Injured reserve", lu(a.id, reserve), lu(b.id, reserve))}`;

        document.getElementById("bxFoot").textContent = "The chip beside each player is his NFL club today.";

        document.getElementById("bxCols").scrollTop = 0;

        bxModal.classList.add("open");
        bxBackdrop.classList.add("open");
        bxModal.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
        document.getElementById("bxClose").focus();
      });
    }

    if (bxModal) {
      document.addEventListener("click", (event) => {
        if (event.target.closest("#bxClose") || event.target.closest("#bxBackdrop")) { closeBox(); return; }
        // The team buttons inside a card or a bracket matchup open the team
        // drawer; leave them alone.
        if (event.target.closest("[data-team]")) return;
        const card = event.target.closest("[data-bx-week]");
        if (card) openBox(Number(card.dataset.bxWeek), card.dataset.bxA, card.dataset.bxB);
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && bxModal.classList.contains("open")) { event.stopImmediatePropagation(); closeBox(); return; }
        if (event.key !== "Enter" && event.key !== " ") return;
        const card = event.target.closest && event.target.closest("[data-bx-week]");
        if (card) { event.preventDefault(); openBox(Number(card.dataset.bxWeek), card.dataset.bxA, card.dataset.bxB); }
      });
    }

    /* =================================================================
       TEAM DRAWER
       ================================================================= */

    const drawer = document.getElementById("teamDrawer");

    /* On a phone the drawer's header shrinks to a slim bar once the schedule
       scrolls, as the player card's does; 60px in, back under 10px, so its
       own change of height cannot make it flicker. */
    document.getElementById("drawerBody").addEventListener("scroll", (event) => {
      const y = event.target.scrollTop;
      if (y > 60 && event.target.scrollHeight - event.target.clientHeight > 160) drawer.classList.add("compact");
      else if (y < 10) drawer.classList.remove("compact");
    }, { passive: true });
    const backdrop = document.getElementById("drawerBackdrop");

    function seasonScheduleFor(teamId) {
      const rows = [];
      for (let w = 1; w <= REGULAR_WEEKS; w++) {
        const game = (schedule[w] || []).find(([a, b]) => a === teamId || b === teamId);
        if (!game) continue;
        const opponent = game[0] === teamId ? game[1] : game[0];
        const scored = (results[w] || []).find(([a, , b]) => a === teamId || b === teamId);
        if (scored) {
          const isFirst = scored[0] === teamId;
          const teamScore = isFirst ? scored[1] : scored[3];
          const oppScore = isFirst ? scored[3] : scored[1];
          rows.push({
            week: w, opponent, teamScore, oppScore,
            result: teamScore > oppScore ? "W" : teamScore < oppScore ? "L" : "T",
            played: true
          });
        } else {
          rows.push({ week: w, opponent, played: false });
        }
      }
      return rows;
    }

    // Every bracket game a team has played.
    function postseasonFor(teamId) {
      return season.postseason
        .filter((g) => g.played && g.a && g.b && (g.a === teamId || g.b === teamId))
        .sort((x, y) => x.week - y.week)
        .map((g) => {
          const mine = g.a === teamId;
          const teamScore = mine ? g.aScore : g.bScore, oppScore = mine ? g.bScore : g.aScore;
          return {
            label: g.label, week: g.week, bracket: g.bracket, opponent: mine ? g.b : g.a, teamScore, oppScore, played: true,
            result: g.winner === teamId ? "W" : "L"
          };
        });
    }

    /* A played score in the team drawer opens that game's box score, once
       the week has lineups. */
    function markScheduleBoxes(teamId) {
      boxWeeks().then((weeks) => {
        if (drawer.dataset.current !== teamId) return;
        document.querySelectorAll("#drawerBody .schedule-score[data-week]").forEach((el) => {
          if (!weeks.has(Number(el.dataset.week))) return;
          el.dataset.bxWeek = el.dataset.week;
          el.dataset.bxA = teamId;
          el.dataset.bxB = el.dataset.opp;
          el.classList.add("bx-link");
          el.setAttribute("role", "button");
          el.setAttribute("aria-label", `Box score, week ${el.dataset.week}`);
          el.tabIndex = 0;
        });
      });
    }

    function scheduleRows(items, postseasonMode = false) {
      return items.map((g) => {
        const opponent = g.opponent;
        const pill = g.played
          ? `<span class="result-pill ${g.result === "W" ? "win" : g.result === "L" ? "loss" : "bye"}">${g.result}</span>`
          : `<span class="result-pill pending">–</span>`;
        const score = g.played
          ? `<strong>${fmt(g.teamScore)}–${fmt(g.oppScore)}</strong>`
          : `<strong>—</strong><span>Not played</span>`;
        return `<div class="schedule-row${postseasonMode ? " post" : ""}">
          <span class="schedule-week">${postseasonMode ? g.label : `Week ${g.week}`}</span>
          ${pill}
          <button type="button" class="schedule-opponent" data-team="${opponent}" aria-label="${nameOf(opponent)}: season and schedule"><strong>vs ${nameOf(opponent)}</strong><span>${ownerOf(opponent)}</span></button>
          <span class="schedule-score"${g.played ? ` data-week="${g.week}" data-opp="${opponent}"` : ""}>${score}</span>
        </div>`;
      }).join("");
    }

    /* Everyone the team started this season, under its schedule in the
       drawer, built from the season's matchups the first time a drawer
       opens. */
    let rosterPromise = null;

    function loadRoster() {
      if (!rosterPromise) rosterPromise = model.roster(SEASON).catch(() => null);
      return rosterPromise;
    }
    window.loadRoster = loadRoster;

    function renderRoster(teamId) {
      const body = document.getElementById("drawerBody");
      const holder = document.createElement("section");
      holder.className = "schedule-section";
      holder.id = "rosterSection";
      body.appendChild(holder);

      loadRoster().then((data) => {
        const team = data && data[teamId];
        // The drawer may have moved on to another team while this loaded.
        if (!team || !team.players.length || !holder.isConnected) { holder.remove(); return; }

        // Always a full season wide (the regular season and the playoff
        // weeks), so a season in progress shows its unplayed weeks as
        // placeholders instead of stretching two weeks across the strip.
        const leagueLast = Math.max(...Object.values(data).flatMap((t) => t.weeks));
        const last = Math.max(LAST_WEEK, leagueLast);
        const weeks = Array.from({ length: last }, (_, i) => i + 1);
        const played = new Set(team.weeks);
        const best = Math.max(...team.players.flatMap((p) => Object.values(p.weeks).filter((w) => w[1]).map((w) => w[0])), 1);
        const cols = `--reg:${REGULAR_WEEKS};--po:${weeks.length - REGULAR_WEEKS};--team-color:${teams[teamId].color}`;
        // The playoffs stand apart by a spacer column of their own; a margin
        // on the first playoff cell used to narrow that one week.
        const po = (w) => (w === REGULAR_WEEKS + 1 ? `<span class="roster-gap"></span>` : "");

        const cell = (p, w) => {
          const wk = p.weeks[w];
          if (w > leagueLast) return `${po(w)}<span class="roster-wk future" title="Week ${w}: not played yet"></span>`;
          if (!played.has(w)) return `${po(w)}<span class="roster-wk none" title="Week ${w}: no game"></span>`;
          if (!wk) return `${po(w)}<span class="roster-wk" title="Week ${w}: not on the team"></span>`;
          const [pts, started, club] = wk;
          if (!started) return `${po(w)}<span class="roster-wk bench" title="Week ${w}: bench · ${fmt(pts)} (${club})"></span>`;
          const fill = .25 + .75 * Math.max(0, pts) / best;
          return `${po(w)}<span class="roster-wk start" style="--fill:${fill.toFixed(2)}" title="Week ${w}: started · ${fmt(pts)} (${club})"></span>`;
        };

        holder.innerHTML = `
          <div class="schedule-heading">
            <div class="roster-title">
              <h3>Starters</h3>
              <button type="button" class="why-btn roster-info" aria-expanded="false" aria-controls="rosterHelp" aria-label="What the week cells mean">i</button>
            </div>
            <span>${team.players.length} players</span>
          </div>
          <div class="roster-help" id="rosterHelp" style="--team-color:${teams[teamId].color}" hidden>
            <p>A strip with one cell per week:</p>
            <ul>
              <li><i class="roster-wk start" style="--fill:.8"></i><span>Filled in the team's color: he started, and a darker cell means he scored more.</span></li>
              <li><i class="roster-wk bench"></i><span>Outlined: he was on the bench.</span></li>
              <li><i class="roster-wk"></i><span>Empty grey: he wasn't on the team.</span></li>
              <li><i class="roster-wk none"></i><span>Playoff weeks sit slightly apart. A week the team had no game, like a playoff bye, is left blank.</span></li>
              <li><i class="roster-wk future"></i><span>Faintly outlined: a week not played yet.</span></li>
            </ul>
            <p class="roster-help-foot">GS is games started; Pts is his points as a starter. Hover a cell for that week's points and club.</p>
          </div>
          <div class="roster-list" style="${cols}">
            <div class="roster-row header">
              <span></span><span>Player</span>
              <span class="roster-strip">${weeks.map((w) => `${po(w)}<span class="roster-wk">${w}</span>`).join("")}</span>
              <span class="roster-num">GS</span><span class="roster-num">Pts</span>
            </div>
            ${team.players.map((p) => `
              <div class="roster-row">
                ${bxClub(p.clubs[0])}
                <span class="roster-name" data-player="${encodeURIComponent(p.id)}" tabindex="0" role="button"><strong title="${esc(p.name)}">${esc(p.name)}</strong><small>${esc(p.pos)} · ${p.clubs.join(" → ")}</small></span>
                <span class="roster-strip">${weeks.map((w) => cell(p, w)).join("")}</span>
                <span class="roster-num"><strong>${p.starts}</strong></span>
                <span class="roster-num"><strong>${fmt(p.pts)}</strong></span>
              </div>`).join("")}
          </div>
          `;
        // Hovering a cell still gives the week, the points and the club; the
        // (i) says what the cells mean.
        const info = holder.querySelector(".roster-info");
        const help = holder.querySelector(".roster-help");
        info.addEventListener("click", () => {
          help.hidden = !help.hidden;
          info.setAttribute("aria-expanded", String(!help.hidden));
        });
      });
    }

    /* Opening another team while the drawer is open (an opponent in the
       schedule, say) slides the current team out to the left and the new one
       in from the right, so it is plain the page has changed. */
    function swapTeam(teamId) {
      const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const parts = [document.getElementById("drawerHero"), document.getElementById("drawerBody")];
      const out = parts.map((el) => el.animate(
        [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateX(-22px)" }],
        { duration: still ? 1 : 150, easing: "cubic-bezier(.4, 0, 1, 1)", fill: "forwards" }));
      out[0].onfinish = () => {
        drawer.dataset.current = teamId;
        openTeam(teamId);
        parts.forEach((el) => {
          el.getAnimations().forEach((a) => a.cancel());
          el.animate([{ opacity: 0, transform: "translateX(22px)" }, { opacity: 1, transform: "none" }],
            { duration: still ? 1 : 280, easing: "cubic-bezier(.2, .8, .2, 1)" });
        });
      };
    }

    function openTeam(teamId) {
      if (!teams[teamId]) return;
      if (drawer.classList.contains("open") && drawer.dataset.current && drawer.dataset.current !== teamId) {
        swapTeam(teamId);
        return;
      }
      drawer.dataset.current = teamId;
      const t = teams[teamId];
      const asOf = asOfWeek(FINISHED ? REGULAR_WEEKS : state.week > REGULAR_WEEKS ? REGULAR_WEEKS : state.week);
      const picture = buildPicture(asOf);
      const line = FINISHED ? t : picture.stats[teamId];
      const seed = asOf > 0 ? picture.seedLabels[teamId] : null;

      document.getElementById("drawerHero").style.setProperty("--drawer-color", t.color);
      drawer.style.setProperty("--drawer-color", t.color);
      const badge = document.getElementById("drawerBadge");
      badge.style.setProperty("--team-color", t.color);
      badge.innerHTML = teamMark(t);
      document.getElementById("drawerYear").textContent = `${SEASON} season`;
      // The name opens the manager's all-time history.
      document.getElementById("drawerName").innerHTML =
        `<a class="drawer-name-link" href="${League.url("alltime", {}, `owner=${encodeURIComponent(t.ownerId)}`)}">${nameOf(teamId)}</a>`;
      drawer.classList.remove("compact");
      document.getElementById("drawerBody").scrollTop = 0;
      document.getElementById("drawerOwner").textContent = `${t.owner}${HAS_DIVISIONS && t.division ? ` · ${divisionLabel(t.division)}` : ""}`;
      document.getElementById("drawerStats").innerHTML = `
        <div class="drawer-stat"><small>Record</small><strong>${FINISHED ? recordOf(t) : line.record}</strong></div>
        <div class="drawer-stat"><small>Points For</small><strong>${fmt(line.pf)}</strong></div>
        <div class="drawer-stat"><small>Points Against</small><strong>${fmt(line.pa)}</strong></div>
        ${FINISHED
          ? `<div class="drawer-stat"><small>Final Place</small><strong>${t.finalRank ? `#${t.finalRank}` : "—"}</strong></div>`
          : `<div class="drawer-stat"><small>Current Seed</small><strong>${seed ? seed.chip : "—"}</strong></div>`}`;

      const post = postseasonFor(teamId);
      const postTitle = post.some((g) => g.bracket === "W") ? "Winner's Bracket" : "Losers Bracket";
      document.getElementById("drawerBody").innerHTML = `
        <section class="schedule-section">
          <div class="schedule-heading"><h3>Regular Season Schedule</h3></div>
          <div class="schedule-list">${scheduleRows(seasonScheduleFor(teamId))}</div>
        </section>
        ${post.length ? `<section class="schedule-section"><div class="schedule-heading"><h3>${postTitle}</h3></div><div class="schedule-list">${scheduleRows(post, true)}</div></section>` : ""}`;

      // On a phone the stat tiles sit at the top of the scrolling content, so
      // they scroll away with it instead of collapsing out of the header.
      document.getElementById("drawerBody").insertAdjacentHTML("afterbegin",
        `<div class="drawer-stats drawer-stats-body">${document.getElementById("drawerStats").innerHTML}</div>`);
      markScheduleBoxes(teamId);
      renderRoster(teamId);

      drawer.classList.add("open");
      backdrop.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeTeam() {
      delete drawer.dataset.current;
      drawer.classList.remove("open");
      backdrop.classList.remove("open");
      drawer.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    document.addEventListener("click", (event) => {
      if (event.target.closest(".season-nav")) return;
      const team = event.target.closest("[data-team]");
      if (team) openTeam(team.dataset.team);
    });

    document.getElementById("drawerClose").addEventListener("click", closeTeam);
    backdrop.addEventListener("click", closeTeam);
    document.addEventListener("keydown", (event) => { if (event.key === "Escape" && !document.querySelector("#bxModal.open")) closeTeam(); });

    /* ?team=<id> opens that team's drawer on arrival (the all-time page's
       Season History links here). It opens a frame after the first paint,
       so it slides in rather than appearing, and the parameter is dropped so
       a reload shows the page itself. */
    (() => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("team");
      if (!id || !teams[id]) return;
      params.delete("team");
      history.replaceState(null, "", `${window.location.pathname}?${params}${window.location.hash}`);
      requestAnimationFrame(() => requestAnimationFrame(() => openTeam(id)));
    })();

    /* =================================================================
       RENDER + ROUTING
       ================================================================= */

    const PANEL_IDS = ["regular", "final", "bracket", "panel-results", "panel-standings", "panel-picture", "panel-playoffs", "panel-sos"];

    function showActivePanel() {
      buildPanel(state.view);
      PANEL_IDS.forEach((id) => {
        const panel = document.getElementById(id);
        if (panel) panel.classList.toggle("active", id === state.view);
      });
      // Ease the panel in whenever it is shown or its week changes.
      const shown = document.getElementById(state.view);
      if (shown) { shown.classList.remove("panel-in", "ui-shuffled"); void shown.offsetWidth; shown.classList.add("panel-in"); }
      if (state.view === "bracket" || state.view === "panel-playoffs" || state.view === "panel-picture") updateBracketNameAlignment();
    }

    /* Only the tab on screen is built when the week changes; the others are
       built the moment they are opened. */
    let pendingPanels = {};

    function buildPanel(id) {
      const job = pendingPanels[id];
      if (!job) return;
      delete pendingPanels[id];
      job();
    }

    function renderAll() {
      renderWeekRail();
      renderViewTabs();
      const week = state.week;
      if (week === 0) {
        pendingPanels = FINISHED ? {} : {
          "panel-results": () => renderResultsPanel(0),
          "panel-standings": () => renderStandingsPanel(0),
          "panel-picture": () => renderPicturePanel(0),
          "panel-sos": () => renderSosPanel(),
        };
      } else if (week > REGULAR_WEEKS) {
        pendingPanels = {
          "panel-playoffs": () => renderPlayoffPanel(week),
          "panel-standings": () => renderStandingsPanel(REGULAR_WEEKS),
        };
      } else {
        pendingPanels = {
          "panel-results": () => renderResultsPanel(week),
          "panel-standings": () => renderStandingsPanel(week),
          "panel-picture": () => renderPicturePanel(week),
        };
      }
      showActivePanel();
    }

    function applyHash() {
      const match = /^#w(\d{1,2})(?:-([a-z-]+))?$/.exec(window.location.hash || "");
      if (!match) return false;
      const week = Number(match[1]);
      if (week < 0 || week > LAST_WEEK) return false;
      const views = viewsFor(week);
      state.week = week;
      state.view = views.some((v) => v.id === match[2]) ? match[2] : week === 0 ? HOME_VIEW : views[0].id;
      return true;
    }

    function writeHash() {
      const next = `#w${state.week}-${state.view}`;
      if (window.location.hash !== next) history.replaceState(null, "", `${window.location.pathname}${window.location.search}${next}`);
    }

    function goToWeek(week) {
      const views = viewsFor(week);
      const previous = viewsFor(state.week).findIndex((v) => v.id === state.view);
      state.week = week;
      // Keep the reader on the same slot when moving between numbered weeks.
      state.view = week === 0 ? HOME_VIEW : (views[previous] || views[0]).id;
      renderAll();
      writeHash();
    }

    /* A new week re-renders the view on screen. When that view is a set of
       standings, each team's row slides from last week's place to this
       week's instead of the table simply redrawing. */
    SeasonNav.mount("#seasonNav", {
      viewsLabel: FINISHED ? "Season views" : "Week views",
      // on a phone, choosing from the bottom capsule scrolls the champion
      // and last-place cards away so the view gets the screen
      hideHero: FINISHED,
      onWeek: (week) => {
        const panel = document.getElementById(state.view);
        const before = UI.measureRows(panel);
        goToWeek(week);
        if (before && document.getElementById(state.view) === panel && UI.shuffleRows(panel, before)) {
          panel.classList.add("ui-shuffled");
        }
      },
      onView: (view) => {
        state.view = view;
        renderViewTabs();
        showActivePanel();
        writeHash();
      },
    });

    // applyHash may substitute a view the week does not offer, so rewrite
    // the URL to what rendered.
    window.addEventListener("hashchange", () => { if (applyHash()) { renderAll(); writeHash(); } });

    renderHero();
    if (FINISHED) {
      renderDivisions();
      renderFinalStandings();
      if (HAS_BRACKET) renderSeasonBracket();
    }
    applyHash();
    renderAll();
    writeHash();
    updateBracketNameAlignment();
    }
  </script>
</body>
</html>
