<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="A Sleeper fantasy football league's season: results, standings, box scores and the playoff bracket." />
  <title>League History</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <meta name="theme-color" content="#071827" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="League History" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <script src="pwa.js" defer></script>
  <script src="player-card.js" defer></script>
  <style>
    /* Moving between pages (a season from the menu, a Season History link)
       crossfades where the browser supports it, instead of flashing white. */
    @view-transition { navigation: auto; }

    :root {
      --ink: #0b1726;
      --muted: #637083;
      --line: #dce3eb;
      --surface: #ffffff;
      --surface-2: #f5f7fa;
      --page: #eef2f6;
      --navy: #071827;
      --navy-2: #102b43;
      --blue: #1769e0;
      --blue-2: #0f56bd;
      --red: #d71920;
      --gold: #f6b73c;
      --green: #16834a;
      --shadow: 0 12px 30px rgba(7, 24, 39, 0.10);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        var(--page);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
    }

    button, select { font: inherit; }
    button { cursor: pointer; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(7, 24, 39, .96);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,.08);
      color: #fff;
    }

    .topbar-inner {
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand {
      color: inherit;
      text-decoration: none;
    }

    /* The league crest. It is a diamond with its own white outline, so it
       needs no plate behind it and no shape cut around it. */
    .brand-mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .brand-mark img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-copy { min-width: 0; }
    .brand-kicker {
      display: block;
      font-size: 10px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #9eb0c1;
      font-weight: 800;
      margin-bottom: 2px;
    }
    .brand-title {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .year-control {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #c9d5df;
      font-size: 13px;
      font-weight: 700;
    }

    .year-control select {
      appearance: none;
      color: #fff;
      background: #16324a;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 10px;
      padding: 10px 38px 10px 14px;
      font-weight: 800;
      outline: none;
      background-image:
        linear-gradient(45deg, transparent 50%, #fff 50%),
        linear-gradient(135deg, #fff 50%, transparent 50%);
      background-position: calc(100% - 16px) 16px, calc(100% - 11px) 16px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    .hero {
      color: #fff;
      border-bottom: 4px solid var(--red);
    }

    .hero-inner {
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(330px, 430px);
      gap: 32px;
      align-items: center;
    }

    .season-hero-title {
      min-width: 0;
    }

    .eyebrow {
      color: #9fc4ff;
      text-transform: uppercase;
      letter-spacing: .19em;
      font-size: 11px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .hero h1 {
      font-size: clamp(54px, 8vw, 92px);
      line-height: .9;
      letter-spacing: -.06em;
      margin: 0;
      max-width: 760px;
    }

    .champ-card {
      justify-self: end;
      width: min(100%, 430px);
      border-radius: 22px;
      padding: 22px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.17);
      box-shadow: 0 24px 65px rgba(0,0,0,.28);
      position: relative;
      overflow: hidden;
    }


    .champ-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffe2a3;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .16em;
      font-weight: 900;
    }

    .champ-team {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 18px 0;
    }

    .champ-team .team-badge { width: 62px; height: 62px; font-size: 29px; }
    .champ-team h2 { margin: 0; font-size: 26px; letter-spacing: -.035em; }
    .champ-team span { color: #bcd0e1; font-size: 13px; }

    .champ-score {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,.13);
    }

    .champ-score strong { display: block; font-size: 22px; }
    .champ-score small { color: #aebdca; }
    .champ-score .versus { font-size: 11px; color: #7690a7; font-weight: 900; }
    .champ-score > div:last-child { text-align: right; }

    main {
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
      padding: 30px 0 70px;
    }

    .season-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: -18px;
      position: relative;
      z-index: 3;
    }

    .metric-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 17px;
      box-shadow: 0 8px 24px rgba(7,24,39,.07);
      min-width: 0;
    }

    .metric-card small {
      display: block;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--muted);
      font-size: 9px;
      font-weight: 900;
      margin-bottom: 7px;
    }

    .metric-card strong {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 16px;
      letter-spacing: -.025em;
    }

    .metric-card span { color: var(--muted); font-size: 12px; }

    .page-toolbar {
      margin: 28px 0 18px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
    }

    .page-title h2 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -.04em;
    }

    .page-title p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .view-tabs {
      display: inline-flex;
      gap: 4px;
      background: #e4e9ef;
      padding: 4px;
      border-radius: 12px;
      flex-wrap: wrap;
    }

    .view-tab {
      border: 0;
      border-radius: 9px;
      padding: 10px 14px;
      color: #536174;
      background: transparent;
      font-size: 13px;
      font-weight: 800;
      transition: .18s ease;
    }

    .view-tab:hover { color: var(--ink); }
    .view-tab.active {
      color: #fff;
      background: var(--navy-2);
      box-shadow: 0 5px 14px rgba(7,24,39,.18);
    }

    .view-panel { display: none; }
    .view-panel.active { display: block; animation: panelIn .2s ease; }
    @keyframes panelIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

    .division-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 19px 20px;
      background: #fbfcfd;
      border-bottom: 1px solid var(--line);
    }

    .card-head h3 {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 18px;
      letter-spacing: -.025em;
    }

    .division-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      padding: 0 8px;
      border-radius: 8px;
      background: var(--navy);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
    }

    .chip-icon {
      width: 16px;
      height: 16px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* An icon needs no side padding; a bare letter or number still does. */
    .division-chip:has(.chip-icon) { padding: 0; width: 28px; }

    .card-head > span { color: var(--muted); font-size: 12px; }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 555px;
    }

    th {
      color: #6b7788;
      font-size: 10px;
      letter-spacing: .09em;
      text-transform: uppercase;
      font-weight: 900;
      padding: 12px 14px;
      text-align: right;
      border-bottom: 1px solid var(--line);
      background: #fbfcfd;
      /* Without this "W–L" breaks at its dash the moment the column is
         squeezed, and the header stacks onto two lines. */
      white-space: nowrap;
    }

    th:first-child, th:nth-child(2) { text-align: left; }

    td {
      padding: 13px 14px;
      border-bottom: 1px solid #edf0f3;
      font-size: 13px;
      text-align: right;
      white-space: nowrap;
    }

    tr:last-child td { border-bottom: 0; }
    tbody tr { transition: background .15s ease; }
    tbody tr:hover { background: #f5f8fb; }
    td:first-child, td:nth-child(2) { text-align: left; }

    .rank {
      color: #7a8796;
      font-weight: 900;
      width: 36px;
    }

    /* `td` keeps every cell on one line so the numbers never wrap. The team
       cell has to opt out: a long enough name held on one line pushes the
       whole table past its container and puts a scrollbar under a desktop
       standings table that otherwise fits. It wraps inside its column now,
       and the column still cannot fall below 250px. */
    .team-cell { min-width: 250px; white-space: normal; }
    .team-cell .team-button { min-width: 0; }
    .team-cell .team-meta { min-width: 0; }
    .team-cell .team-name { overflow-wrap: anywhere; }
    .team-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--blue-2);
      font-weight: 800;
      text-align: left;
    }
    .team-button:hover .team-name { text-decoration: underline; }

    .team-badge {
      width: 34px;
      height: 34px;
      display: inline-grid;
      place-items: center;
      border-radius: 10px;
      font-size: 17px;
      color: #fff;
      background: var(--team-color, var(--navy-2));
      border: 2px solid rgba(255,255,255,.5);
      box-shadow: 0 0 0 1px rgba(7,24,39,.12), inset 0 -8px 14px rgba(0,0,0,.13);
      flex: 0 0 auto;
    }

    .team-meta { display: flex; flex-direction: column; gap: 2px; }
    .team-name { color: var(--blue-2); font-size: 13px; }
    .owner { color: var(--muted); font-size: 11px; font-weight: 600; }

    .record { font-weight: 900; }
    .positive { color: var(--green); }
    .negative { color: #c92929; }
    .muted { color: var(--muted); }

    .final-card .card-head { padding-bottom: 15px; }
    .final-table { min-width: 900px; }
    .final-table .place { width: 56px; }
    .final-table .team-cell { min-width: 300px; }
    .champion-row { background: rgba(246,183,60,.12); }
    .champion-row:hover { background: rgba(246,183,60,.16); }
    .place-medal { font-size: 17px; margin-right: 4px; }

    .sort-button {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      gap: 5px;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-transform: inherit;
      letter-spacing: inherit;
      white-space: nowrap;
      cursor: pointer;
    }

    .sort-button:hover,
    .sort-button.active {
      color: var(--blue-2);
    }

    .sort-indicator {
      min-width: 10px;
      font-size: 11px;
      line-height: 1;
      color: var(--red);
    }

    .bracket-card { padding: 0; }

    .bracket-head {
      min-height: 0;
    }

    .bracket-head > div {
      display: flex;
      align-items: center;
    }

    .bracket-head h3 {
      margin: 0;
    }

    .bracket-head {
      padding: 20px 22px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: #fbfcfd;
    }
    .bracket-head h3 { margin: 0; font-size: 19px; }
    .bracket-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .bracket-tag {
      color: #fff;
      background: var(--red);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
      border-radius: 999px;
      padding: 8px 11px;
      white-space: nowrap;
    }

    .bracket-scroll { overflow-x: auto; }
    .bracket {
      min-width: 1050px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      padding: 24px;
      background:
        linear-gradient(rgba(255,255,255,.94), rgba(255,255,255,.94)),
        repeating-linear-gradient(90deg, #dfe7ef 0 1px, transparent 1px 48px),
        repeating-linear-gradient(0deg, #dfe7ef 0 1px, transparent 1px 48px);
    }

    .round {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .round-title {
      padding: 0 3px 12px;
      border-bottom: 3px solid var(--navy-2);
      margin-bottom: 18px;
    }
    .round-title strong { display: block; font-size: 13px; letter-spacing: .02em; }
    .round-title span { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }

    .round-games { display: flex; flex-direction: column; justify-content: space-around; flex: 1; gap: 18px; }
    .round-2 .round-games { padding: 60px 0; gap: 100px; }
    .round-3 .round-games { justify-content: center; padding: 140px 0; }

    .matchup {
      position: relative;
      background: #fff;
      border: 1px solid #cfd8e2;
      border-radius: 14px;
      padding: 8px 12px;
      box-shadow: 0 7px 18px rgba(7,24,39,.07);
    }

    .matchup-row {
      display: grid;
      grid-template-columns: 46px 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 8px 2px;
      color: #7e8996;
      font-size: 12px;
    }
    .matchup-row + .matchup-row { border-top: 1px solid #edf0f3; }
    .matchup-row.winner { color: var(--ink); font-weight: 900; }
    .matchup-row .seed { color: #758191; font-size: 10px; font-weight: 900; white-space: nowrap; }
    .matchup-row .score { font-size: 15px; font-variant-numeric: tabular-nums; }
    .matchup-row .mini-team { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .matchup-row .mini-team span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mini-badge {
      width: 23px; height: 23px; border-radius: 7px; display: grid; place-items: center;
      color: #fff; font-size: 12px; background: var(--team-color, var(--navy));
      flex: 0 0 auto;
    }
    .bye { min-height: 94px; display: flex; flex-direction: column; justify-content: center; }
    .bye-label { padding: 6px 2px 2px 56px; color: #8a95a2; font-size: 10px; text-transform: uppercase; letter-spacing: .12em; font-weight: 900; }
    .championship-matchup {
      border: 2px solid var(--gold);
      box-shadow: 0 14px 34px rgba(246,183,60,.24);
    }
    .championship-matchup::before {
      content: "CHAMPION";
      position: absolute;
      right: 12px;
      top: -11px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--gold);
      color: #2d2105;
      font-size: 8px;
      font-weight: 1000;
      letter-spacing: .1em;
    }


    .losers-card {
      margin-top: 22px;
    }

    .losers-card .bracket-head {
      background: #fffbfb;
    }

    .losers-card .bracket-tag {
      background: #a62f2b;
    }

    .losers-bracket .round-2 .round-games,
    .losers-bracket .round-3 .round-games {
      justify-content: center;
      padding: 68px 0;
      gap: 18px;
    }

    .matchup-kicker {
      margin: -1px 2px 5px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .matchup-path {
      margin-top: 6px;
      padding: 8px 2px 1px;
      border-top: 1px solid #edf0f3;
      color: #687585;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .last-place-matchup {
      border: 2px solid #d6433d;
      box-shadow: 0 14px 34px rgba(214,67,61,.18);
    }

    .last-place-matchup::before {
      content: "LAST PLACE";
      position: absolute;
      right: 12px;
      top: -11px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #d6433d;
      color: #fff;
      font-size: 8px;
      font-weight: 1000;
      letter-spacing: .12em;
    }

    .last-place-row {
      color: #a62f2b !important;
      font-weight: 900;
    }

    .source-note {
      margin-top: 14px;
      color: var(--muted);
      font-size: 11px;
      text-align: right;
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 70;
      background: rgba(4, 14, 23, .64);
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
      backdrop-filter: blur(3px);
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }

    .team-drawer {
      position: fixed;
      z-index: 80;
      top: 0;
      right: 0;
      width: min(680px, 100%);
      height: 100dvh;
      background: #f6f8fa;
      box-shadow: -25px 0 65px rgba(0,0,0,.25);
      transform: translateX(104%);
      transition: transform .26s cubic-bezier(.2,.8,.2,1);
      display: flex;
      flex-direction: column;
    }
    .team-drawer.open { transform: translateX(0); }

    /* Desktop: the team panel opens on the left, leaving the right of the
       screen for a player card opened from it. */
    @media (min-width: 761px) {
      .team-drawer { left: 0; right: auto; transform: translateX(-104%); box-shadow: 25px 0 65px rgba(0,0,0,.25); }
      .team-drawer.open { transform: translateX(0); }
    }

    .drawer-hero {
      padding: 22px;
      color: #fff;
      background: var(--drawer-color, var(--navy-2));
      position: relative;
      overflow: hidden;
    }
    .drawer-hero::after {
      content: "";
      position: absolute;
      width: 260px; height: 260px;
      right: -120px; top: -110px;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
    }

    .drawer-close {
      position: absolute;
      top: 16px; right: 16px;
      z-index: 2;
      width: 38px; height: 38px;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.1);
      color: #fff;
      border-radius: 10px;
      font-size: 22px;
      line-height: 1;
    }

    .drawer-team {
      display: flex;
      align-items: center;
      gap: 15px;
      padding-right: 46px;
    }
    .drawer-team .team-badge { width: 58px; height: 58px; font-size: 28px; }
    .drawer-team h2 { margin: 0 0 4px; font-size: 25px; letter-spacing: -.04em; }
    .drawer-team p { margin: 0; color: rgba(255,255,255,.72); font-size: 13px; }
    .drawer-year {
      display: inline-block; margin-bottom: 6px; padding: 2px 8px; border-radius: 999px;
      background: rgba(255,255,255,.16); color: #fff;
      font-size: 10px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase;
    }

    .drawer-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 18px;
    }
    .drawer-stat {

      /* The header's lines fold away smoothly rather than vanishing. */

    /* Compact season outcome cards */
    .hero-inner.outcome-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      padding: 24px 0;
      align-items: stretch;
    }

    .outcome-card {
      position: relative;
      overflow: hidden;
      min-width: 0;
      padding: 14px 16px 14px 19px;
      border: 1px solid rgba(255,255,255,.17);
      border-radius: 16px;
      background: rgba(255,255,255,.10);
      box-shadow: 0 18px 45px rgba(0,0,0,.22);

      /* The crest sits to the left of both identity rows and the result runs
         underneath them, so the card reads as two bands rather than three
         stacked strips with air between each. */
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      column-gap: 13px;
      align-items: center;
    }

    /* The whole card takes the colour of its outcome rather than wearing a
       stripe, and the trophy or the turd it already carries in the label is
       blown up behind the score as a watermark. Which card is which reads
       from across the room; the emoji does the work no label needs to. */
    .champion-outcome {
      --outcome-accent: #f6b73c;
      background: rgba(246,183,60,.10);
      border-color: rgba(246,183,60,.34);
    }

    .loser-outcome {
      --outcome-accent: #c9423c;
      background: rgba(201,66,60,.11);
      border-color: rgba(201,66,60,.32);
    }

    .outcome-card::after {
      content: "🏆";
      position: absolute;
      right: -12px;
      bottom: -26px;
      font-size: 94px;
      line-height: 1;
      opacity: .09;
      transform: rotate(-12deg);
      pointer-events: none;
    }

    .loser-outcome::after { content: "💩"; }

    /* Hands the crest and the name block straight to the card's own grid. */
    .outcome-team { display: contents; }

    .outcome-team .team-badge {
      grid-area: 1 / 1 / 3 / 2;
      align-self: center;
      width: 54px;
      height: 54px;
      border-radius: 14px;
      font-size: 25px;
      box-shadow: 0 0 0 2px var(--outcome-accent);
    }

    .outcome-label {
      grid-area: 1 / 2 / 2 / 3;
      align-self: end;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      width: fit-content;
      padding: 3px 8px;
      border-radius: 999px;
      color: #3b2a05;
      background: #ffe6a6;
      font-size: 8px;
      font-weight: 1000;
      letter-spacing: .12em;
      line-height: 1;
      text-transform: uppercase;
    }

    .loser-outcome .outcome-label {
      color: #fff;
      background: #c9423c;
    }

    .outcome-team > div {
      grid-area: 2 / 2 / 3 / 3;
      align-self: start;
      min-width: 0;
      margin-top: 5px;
    }

    .outcome-team h2 {
      margin: 0;
      font-size: 21px;
      line-height: 1.05;
      letter-spacing: -.03em;
      overflow-wrap: anywhere;
    }

    .outcome-team span {
      display: block;
      margin-top: 3px;
      color: #bfd0df;
      font-size: 10.5px;
    }

    /* The two numbers sit next to each other so the result reads as one
       scoreline, with the margin pinned to the far end. */
    .outcome-score {
      grid-area: 3 / 1 / 4 / 3;
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin-top: 12px;

    .outcome-score-side {

    .outcome-score-side:last-child small {

    }

    .outcome-score-side:last-child strong {

    .outcome-score strong {

    .outcome-score small {

    /* How decisive it was, with the arrow pointing from the subject's side. */
    .outcome-margin {

    /* --- v4 modern overhaul: depth, glass, gradient accents, motion
       (purely visual — data structure, columns and copy are unchanged) --- */

    /* Layered light mesh gives the page real depth instead of a flat wash */
    /* The field carries onto the page itself, at a sixth the strength it has
       on the hero — enough to give the white space a grain, not a pattern. */
    body {
      background:
        repeating-linear-gradient(90deg, transparent 0 149px, rgba(11,23,38,.045) 149px 150px),
        repeating-linear-gradient(90deg, transparent 0 29px, rgba(11,23,38,.018) 29px 30px),
        #f0f4f9;
    }

    /* Premium card depth: crisp top highlight, soft contact + ambient shadow */
    .card {
      border-color: rgba(15,34,55,.09);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.85),
        0 1px 2px rgba(10,22,38,.05),
        0 22px 46px -26px rgba(10,22,38,.42);
    }

    /* Warmer card header with a faint tri-color rule bleeding along its base */
    .card-head {
      position: relative;
      background: #fafcfe;
    }
    .card-head::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: -1px;
      height: 2px;
      background: rgba(23,105,224,.35);
      opacity: .75;
    }

    /* Section chip becomes a glossy gradient token with a soft blue glow */
    .division-chip {
      background: var(--blue);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.22),
        0 6px 14px -5px rgba(23,105,224,.6);
    }

    /* Table: brighter header, gradient row hover with a leading accent bar */
    th {
      background: #f6f9fc;
    }
    tbody tr { transition: background .18s ease, box-shadow .18s ease; }
    tbody tr:hover {
      background: rgba(23,105,224,.05);
      box-shadow: inset 3px 0 0 rgba(23,105,224,.6);
    }
    /* Champion keeps a standing gold bar so it reads as first at a glance */
    .champion-row,
    .champion-row:hover { box-shadow: inset 3px 0 0 var(--gold); }

    /* Team badges get a subtle ring + lift so the emojis feel like real crests */
    .team-badge {
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.35),
        0 6px 14px -6px rgba(7,24,39,.55);
    }

    /* Segmented view switcher reads as a modern pill control */
    .view-tabs {
      background: rgba(12,28,45,.06);
      border-radius: 999px;
      box-shadow: inset 0 1px 2px rgba(7,24,39,.08);
    }
    .view-tab {
      border-radius: 999px;
      transition: color .2s ease, background .2s ease, box-shadow .2s ease, transform .2s ease;
    }
    .view-tab.active {
      background: var(--navy-2);
      box-shadow: 0 8px 18px -7px rgba(7,24,39,.7), inset 0 1px 0 rgba(255,255,255,.12);
    }

    /* Outcome cards: gradient-lit rim + hover lift; champion adds the gold sheen */
    .outcome-card {
      border-color: rgba(255,255,255,.22);
      transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease;
    }
    .outcome-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 30px 64px -28px rgba(0,0,0,.6);
    }
    .champion-outcome { border-color: rgba(246,183,60,.42); }


    /* The hero is the field: yard lines every thirty pixels, a heavier one
       every fifth, and two rows of hash marks across the middle. All of it
       sits at an alpha you notice only once you look for it. */
    .hero {
      position: relative;
      overflow: hidden;
      background:
        repeating-linear-gradient(90deg, transparent 0 28px, rgba(255,255,255,.075) 28px 30px) 0 34% / 100% 7px no-repeat,
        repeating-linear-gradient(90deg, transparent 0 28px, rgba(255,255,255,.075) 28px 30px) 0 68% / 100% 7px no-repeat,
        repeating-linear-gradient(90deg, transparent 0 149px, rgba(255,255,255,.055) 149px 150px),
        repeating-linear-gradient(90deg, transparent 0 29px, rgba(255,255,255,.022) 29px 30px),
        rgba(7, 24, 39, .98);
    }

    /* A ball resting off the right edge of the field, mostly out of frame. */
    .hero::before {
      content: "🏈";
      position: absolute;
      right: -26px;
      top: 50%;
      transform: translateY(-50%) rotate(-24deg);
      font-size: 150px;
      line-height: 1;
      opacity: .055;
      pointer-events: none;
      z-index: 0;
    }

    /* A hero holding the champion and last-place cards already has a trophy
       and a turd behind their scores. The cards are translucent, so the ball
       showed through and tangled with both - at phone width it sat right on
       top of them. One watermark per card is plenty. */
    .hero:has(.outcome-grid)::before { content: none; }

    .hero-inner { position: relative; z-index: 1; }

    /* Smooth link affordance on team names */
    .team-button { transition: transform .15s ease; }
    .team-name { transition: color .15s ease; }

    /* Season title carries a gradient accent bar — a crisp modern signature */
    .page-title h2 {
      position: relative;
      padding-left: 15px;
    }
    .page-title h2::before {
      content: "";
      position: absolute;
      left: 0;
      top: .12em;
      bottom: .12em;
      width: 5px;
      border-radius: 999px;
      background: var(--blue);
    }


    /* Week rail ---------------------------------------------------- */

    .week-rail-wrap {
      width: min(1220px, calc(100% - 32px));
      margin: 22px auto 0;
    }

    .week-rail-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .week-rail-head strong {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .week-rail-head span {
      font-size: 12px;
      color: var(--muted);
    }

    .week-rail {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      scrollbar-width: thin;
    }

    .week-pill {
      flex: 0 0 auto;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 10px;
      padding: 8px 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      line-height: 1.1;
      color: var(--ink);
      font-weight: 800;
      font-size: 13px;
      white-space: nowrap;
      transition: background .15s ease, color .15s ease;
    }

    .week-pill small {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .week-pill:hover { background: var(--surface-2); }

    .week-pill.active {
      background: var(--navy);
      color: #fff;
    }

    .week-pill.active small { color: rgba(255, 255, 255, .66); }

    .week-pill.upcoming { color: var(--muted); }

    .week-pill.played small { color: var(--green); }

    /* Phones get a single dropdown instead of a rail that runs off-screen. */
    .week-select-wrap { display: none; }
    .view-select-wrap { display: none; }

    @media (max-width: 700px) {
      .week-rail { display: none; }

      .week-select-wrap {
        display: block;
        position: relative;
      }

      .week-select-wrap::after {
        content: "";
        position: absolute;
        right: 18px;
        top: 50%;
        width: 9px;
        height: 9px;
        margin-top: -6px;
        border-right: 2.5px solid rgba(255, 255, 255, .8);
        border-bottom: 2.5px solid rgba(255, 255, 255, .8);
        transform: rotate(45deg);
        pointer-events: none;
      }

      #weekSelect {
        width: 100%;
        appearance: none;
        -webkit-appearance: none;
        background: var(--navy-2);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, .14);
        border-radius: 14px;
        padding: 14px 42px 14px 16px;
        font-size: 15px;
        font-weight: 800;
        box-shadow: var(--shadow);
      }

      #weekSelect:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

      /* Five view tabs on a phone came out as a cramped two-column grid with
         an orphan on the last row. One control naming the view you are on
         reads better and takes a line instead of three. */
      .view-tabs { display: none; }

      .view-select-wrap {
        display: block;
        position: relative;
        width: 100%;
      }

      .view-select-wrap::after {
        content: "";
        position: absolute;
        right: 18px;
        top: 50%;
        width: 9px;
        height: 9px;
        margin-top: -6px;
        border-right: 2.5px solid rgba(255, 255, 255, .8);
        border-bottom: 2.5px solid rgba(255, 255, 255, .8);
        transform: rotate(45deg);
        pointer-events: none;
      }

      #viewSelect {
        width: 100%;
        appearance: none;
        -webkit-appearance: none;
        background: var(--navy);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, .14);
        border-radius: 14px;
        padding: 13px 42px 13px 16px;
        font-size: 15px;
        font-weight: 800;
        box-shadow: var(--shadow);
      }

      #viewSelect:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
